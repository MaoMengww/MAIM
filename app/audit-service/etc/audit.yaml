Name: audit.rpc
ListenOn: 0.0.0.0:50059
Etcd:
  Hosts:
  - 127.0.0.1:2379
  Key: audit.rpc

Database:
  Driver: postgres
  DSN: postgres://aim:aim123@127.0.0.1:5432/aim?sslmode=disable&search_path=audit
  MaxOpenConn: 50
  MaxIdleConn: 10
  MaxLifetime: 3600

Kafka:
  Brokers:
  - 127.0.0.1:9092
  ConsumerGroup: audit-service
  Version: 2.8.0

MinIO:
  Endpoint: 127.0.0.1:9000
  AccessKey: minioadmin
  SecretKey: minioadmin123
  UseSSL: false
  Bucket: aim

Snowflake:
  WorkerId: 10

Audit:
  ExportMaxEvents: 10000
  ExportDir: audit/exports

Log:
  Level: info
  Stat: false

CpuThreshold: 900

RateLimit:
  Enabled: true
  RequestsPerSecond: 100
  Concurrency: 10

Telemetry:
  Name: audit.rpc
  Endpoint: localhost:4317
  Sampler: 1.0
  Batcher: otlpgrpc

Prometheus:
  Host: 0.0.0.0
  Port: 9109
