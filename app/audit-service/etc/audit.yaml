Name: audit.rpc
ListenOn: 0.0.0.0:50059

Database:
  Driver: postgres
  DSN: ${POSTGRES_DSN_BASE}?sslmode=disable&search_path=audit
  MaxOpenConn: 50
  MaxIdleConn: 10
  MaxLifetime: 3600

Kafka:
  Brokers: ${KAFKA_BROKERS}
  ConsumerGroup: audit-service
  Version: 2.8.0

MinIO:
  Endpoint: ${MINIO_ENDPOINT}
  AccessKey: ${MINIO_ACCESS_KEY}
  SecretKey: ${MINIO_SECRET_KEY}
  UseSSL: false
  Bucket: aim

Snowflake:
  WorkerId: 10

Audit:
  ExportMaxEvents: 10000
  ExportDir: audit/exports

Log:
  Level: info
  Stat: false

CpuThreshold: 900

RateLimit:
  Enabled: true
  RequestsPerSecond: 100
  Concurrency: 10

Telemetry:
  Name: audit.rpc
  Endpoint: ${OTEL_ENDPOINT}
  Sampler: 1.0
  Batcher: otlpgrpc

Prometheus:
  Host: 0.0.0.0
  Port: 9109
