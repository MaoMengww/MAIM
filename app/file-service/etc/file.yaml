Name: file.rpc
ListenOn: 0.0.0.0:50054
Database:
  driver: postgres
  dsn: ${POSTGRES_DSN_BASE}?sslmode=disable&search_path=file
  maxOpenConn: 100
  maxIdleConn: 10
  maxLifetime: 3600
MinIO:
  endpoint: ${MINIO_ENDPOINT}
  publicEndpoint: ${MINIO_PUBLIC_ENDPOINT}
  accessKey: ${MINIO_ACCESS_KEY}
  secretKey: ${MINIO_SECRET_KEY}
  useSSL: false
  bucket: aim

Log:
  Level: info
  Stat: false

CpuThreshold: 900

RateLimit:
  Enabled: true
  RequestsPerSecond: 100
  Concurrency: 10

Telemetry:
  Name: file.rpc
  Endpoint: ${OTEL_ENDPOINT}
  Sampler: 1.0
  Batcher: otlpgrpc

Prometheus:
  Host: 0.0.0.0
  Port: 9105
