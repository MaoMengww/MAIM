Name: conversation.rpc
ListenOn: 0.0.0.0:50055
Database:
  Driver: postgres
  DSN: ${POSTGRES_DSN_BASE}?sslmode=disable&search_path=conv
  MaxOpenConn: 100
  MaxIdleConn: 100
Redis:
  Host: ${REDIS_ADDR}
  Type: node
  Pass: ""
  Key: conversation.rpc
Snowflake:
  WorkerId: 2
Kafka:
  consumerGroup: conv-msg-consumer
  brokers: ${KAFKA_BROKERS}
  maxRetry: 3
Conv:
  MaxMemberCount: 500
  MaxGroupNameLen: 64
  MaxAliasLen: 32
  MaxAnnouncementLen: 1024
MessageService:
  Target: ${MESSAGE_SERVICE_ADDR}

BotPlatform:
  Target: ${BOT_PLATFORM_ADDR}
  Middlewares:
    Breaker: true

UserService:
  Target: ${USER_SERVICE_ADDR}
  Middlewares:
    Breaker: true

Log:
  Level: info
  Stat: false

CpuThreshold: 900
Middlewares:
  Breaker: true
  Trace: true

RateLimit:
  Enabled: true
  RequestsPerSecond: 100
  Concurrency: 10

Telemetry:
  Name: conversation.rpc
  Endpoint: ${OTEL_ENDPOINT}
  Sampler: 0
  Batcher: otlpgrpc

Prometheus:
  Host: 0.0.0.0
  Port: 9103
