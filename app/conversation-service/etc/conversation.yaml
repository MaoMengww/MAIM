Name: conversation.rpc
ListenOn: 0.0.0.0:50055
Etcd:
  Hosts:
  - 127.0.0.1:2379
  Key: conversation.rpc
Database:
  Driver: postgres
  DSN: postgres://aim:aim123@localhost:5432/aim?sslmode=disable&search_path=conv
  MaxOpenConn: 100
  MaxIdleConn: 100
Redis:
  Host: localhost:6379
  Type: node
  Pass: ""
  Key: conversation.rpc
Snowflake:
  WorkerId: 2
Kafka:
  consumerGroup: conv-msg-consumer
  brokers:
  - localhost:9092
  maxRetry: 3
Conv:
  MaxMemberCount: 500
  MaxGroupNameLen: 64
  MaxAliasLen: 32
  MaxAnnouncementLen: 1024
MessageService:
  Etcd:
    Hosts:
    - 127.0.0.1:2379
    Key: message.rpc

BotPlatform:
  Etcd:
    Hosts:
    - 127.0.0.1:2379
    Key: bot-platform.rpc
  Middlewares:
    Breaker: true

UserService:
  Etcd:
    Hosts:
    - 127.0.0.1:2379
    Key: user.rpc
  Middlewares:
    Breaker: true

Log:
  Level: info
  Stat: false

CpuThreshold: 900
Middlewares:
  Breaker: true
  Trace: true

RateLimit:
  Enabled: true
  RequestsPerSecond: 100
  Concurrency: 10

Telemetry:
  Name: conversation.rpc
  Endpoint: localhost:4317
  Sampler: 0
  Batcher: otlpgrpc

Prometheus:
  Host: 0.0.0.0
  Port: 9103
