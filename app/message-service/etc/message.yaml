Name: message-service
ListenOn: 0.0.0.0:50053

Database:
  driver: postgres
  dsn: ${POSTGRES_DSN_BASE}?sslmode=disable&search_path=msg
  maxOpenConn: 200
  maxIdleConn: 200
  maxLifetime: 3600

Redis:
  Host: ${REDIS_ADDR}
  Type: node
  Pass: ""
  Key: message.rpc

Kafka:
  brokers: ${KAFKA_BROKERS}
  consumerGroup: message-inbox-writer
  maxRetry: 3

Elasticsearch:
  addresses: ${ELASTICSEARCH_ADDRESSES}

Message:
  recallWindowSeconds: 120
  editWindowSeconds: 120
  maxPageSize: 100

Snowflake:
  workerId: 1

ConvService:
  Target: ${CONVERSATION_SERVICE_ADDR}
  Middlewares:
    Breaker: true
UserService:
  Target: ${USER_SERVICE_ADDR}
  Middlewares:
    Breaker: true

BotPlatform:
  Target: ${BOT_PLATFORM_ADDR}
  Middlewares:
    Breaker: true

Log:
  Level: info
  Stat: false

CpuThreshold: 900
Middlewares:
  Breaker: true
  Trace: true

RateLimit:
  Enabled: true
  RequestsPerSecond: 100
  Concurrency: 10

Telemetry:
  Name: message.rpc
  Endpoint: ${OTEL_ENDPOINT}
  Sampler: 0
  Batcher: otlpgrpc

Prometheus:
  Host: 0.0.0.0
  Port: 9102
