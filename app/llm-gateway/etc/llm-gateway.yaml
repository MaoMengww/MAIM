Name: llm-gateway.rpc
ListenOn: 0.0.0.0:50056
Timeout: 600000

Log:
  Level: info
  Stat: false

Database:
  Driver: postgres
  DSN: ${POSTGRES_DSN_BASE}?sslmode=disable&search_path=llm
  MaxOpenConn: 50
  MaxIdleConn: 10
  MaxLifetime: 3600

Redis:
  Host: ${REDIS_ADDR}
  Type: node
  Pass: ""
  Key: ""

ModelConf:
  RefreshInterval: 300s

Capacity:
  MaxInFlight: ${LLM_CAPACITY_MAX_IN_FLIGHT}
  LeaseDuration: ${LLM_CAPACITY_LEASE_DURATION}
  PollInterval: ${LLM_CAPACITY_POLL_INTERVAL}

IngestEmbeddingToken: ${INGEST_EMBEDDING_TOKEN}

EncKey: ${ENC_KEY}
CpuThreshold: 900

Telemetry:
  Name: llm-gateway.rpc
  Endpoint: ${OTEL_ENDPOINT}
  Sampler: 1.0
  Batcher: otlpgrpc

Prometheus:
  Host: 0.0.0.0
  Port: 9107

UserService:
  Target: ${USER_SERVICE_ADDR}
