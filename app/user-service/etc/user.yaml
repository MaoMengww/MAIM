Name: user.rpc
ListenOn: 0.0.0.0:50051
Log:
  Level: info
  Stat: false
Database:
  Driver: postgres
  DSN: ${POSTGRES_DSN_BASE}?sslmode=disable&search_path=user
  ReadDSN: ""
  MaxOpenConn: 50
  MaxIdleConn: 10
  MaxLifetime: 3600
AppRedis:
  Host: ${REDIS_ADDR}
  Pass: ""
  ClusterMode: false
JWT:
  Secret: ${JWT_SECRET}
  ExpireSec: 3600
  RefreshSec: 2592000
CpuThreshold: 900

RateLimit:
  Enabled: true
  RequestsPerSecond: 100
  Concurrency: 10

Telemetry:
  Name: user.rpc
  Endpoint: ${OTEL_ENDPOINT}
  Sampler: 0
  Batcher: otlpgrpc
Prometheus:
  Host: 0.0.0.0
  Port: 9101
