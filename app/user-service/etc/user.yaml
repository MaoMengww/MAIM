Name: user.rpc
ListenOn: 0.0.0.0:50051
Etcd:
  Hosts:
  - 127.0.0.1:2379
  Key: user.rpc
Log:
  Level: info
  Stat: false
Database:
  Driver: postgres
  DSN: postgres://aim:aim123@localhost:5432/aim?sslmode=disable&search_path=user
  ReadDSN: ""
  MaxOpenConn: 50
  MaxIdleConn: 10
  MaxLifetime: 3600
AppRedis:
  Host: localhost:6379
  Pass: ""
  ClusterMode: false
JWT:
  Secret: aim-dev-secret-key
  ExpireSec: 3600
  RefreshSec: 2592000
CpuThreshold: 900

RateLimit:
  Enabled: true
  RequestsPerSecond: 100
  Concurrency: 10

Telemetry:
  Name: user.rpc
  Endpoint: localhost:4317
  Sampler: 0
  Batcher: otlpgrpc
Prometheus:
  Host: 0.0.0.0
  Port: 9101
