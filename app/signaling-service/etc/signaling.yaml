Name: signaling-service
Mode: dev
ListenOn: 0.0.0.0:50061
Kafka:
  Brokers: ${KAFKA_BROKERS}
  ConsumerGroup: signaling-service
  Version: "2.8.0"
  MaxRetry: 3
Database:
  DSN: ${POSTGRES_DSN_BASE}?sslmode=disable&search_path=notify
  Driver: postgres
  MaxOpenConn: 100
  MaxIdleConn: 10
  MaxLifetime: 3600
Redis:
  Host: ${REDIS_ADDR}
  Type: node
  Pass: ""
  Key: signaling-service.rpc
  Addr: ${REDIS_ADDR}
  DB: 0
  PoolSize: 100
  MinIdleConn: 10
MessageService:
  Target: ${MESSAGE_SERVICE_ADDR}
BotService:
  Target: ${BOT_SERVICE_ADDR}
WsGateway:
  Target: ${WS_GATEWAY_ADDR}
  NonBlock: true
Log:
  Level: info
  Stat: false
CpuThreshold: 900

RateLimit:
  Enabled: true
  RequestsPerSecond: 100
  Concurrency: 10

Push:
  fcmEnabled: false
  fcmCredentials: "unused"
  apnsEnabled: false
  apnsKeyFile: "unused"
  apnsKeyID: "unused"
  apnsTeamID: "unused"
  apnsTopic: "unused"
