Name: knowledge-base.rpc
ListenOn: 0.0.0.0:50057
Timeout: 600000

Log:
  Level: info
  Stat: false

CpuThreshold: 900

RateLimit:
  Enabled: true
  RequestsPerSecond: 100
  Concurrency: 10

Ingest:
  RequestsPerSecond: ${INGEST_REQUESTS_PER_SECOND}
  Concurrency: ${INGEST_CONCURRENCY}
  HealthPort: 9092
  MetricsPort: 9118
  EmbeddingToken: ${INGEST_EMBEDDING_TOKEN}

Telemetry:
  Name: knowledge-base.rpc
  Endpoint: ${OTEL_ENDPOINT}
  Sampler: 1.0
  Batcher: otlpgrpc

Prometheus:
  Host: 0.0.0.0
  Port: 9108

Database:
  Driver: postgres
  DSN: ${POSTGRES_DSN_BASE}?sslmode=disable&search_path=knowledge

AppRedis:
  Host: ${REDIS_ADDR}
  Type: node
  Pass: ""
  Key: knowledge-base.rpc

Milvus:
  Address: ${MILVUS_HOST}:${MILVUS_PORT}
  DBName: default

Minio:
  Endpoint: ${MINIO_ENDPOINT}
  AccessKey: ${MINIO_ACCESS_KEY}
  SecretKey: ${MINIO_SECRET_KEY}
  UseSSL: false
  Bucket: aim

Kafka:
  Brokers: ${KAFKA_BROKERS}
  ConsumerGroup: knowledge-ingest
  Version: 2.8.0

LLMGateway:
  Target: ${LLM_GATEWAY_ADDR}
  Timeout: 600000


MinerU:
  URL: ${MINERU_URL}
  Timeout: 60

Snowflake:
  WorkerId: 3

MaxFileSize: 10485760
RetryLimit: 3
