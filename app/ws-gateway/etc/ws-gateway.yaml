Name: ws-gateway
ListenOn: 0.0.0.0:50060
Host: 0.0.0.0
Port: 50060

WebSocket:
  Host: 0.0.0.0
  Port: 8081
  ReadBufferSize: 4096
  WriteBufferSize: 4096
  HeartbeatInterval: 30
  MaxConn: 10000

JWT:
  Secret: ${JWT_SECRET}
  ExpireSec: 7200
  RefreshSec: 604800

BotPlatform:
  Target: ${BOT_PLATFORM_ADDR}
  NonBlock: true

MessageService:
  Target: ${MESSAGE_SERVICE_ADDR}
  NonBlock: true

Redis:
  Host: ${REDIS_ADDR}
  Password: ""
  DB: 0
  PoolSize: 100
  MinIdleConn: 10

Metrics:
  Port: 9110

Log:
  Level: info
  Format: text

Telemetry:
  Name: ws-gateway
  Endpoint: ${OTEL_ENDPOINT}
  Sampler: 1.0

StreamCache:
  Enabled: true
  TTLSeconds: 60
  MaxChunksPerStream: 500
