Name: bot-platform.rpc
ListenOn: 0.0.0.0:8085
Mode: dev

Database:
  DSN: ${POSTGRES_DSN_BASE}?sslmode=disable&search_path=bot
  MaxOpenConn: 50
  MaxIdleConn: 10
  MaxLifetime: 3600

JWT:
  Secret: ${JWT_SECRET}
  ExpireSec: 86400

messageService:
  Target: ${MESSAGE_SERVICE_ADDR}
  NonBlock: true

Log:
  Stat: false

CpuThreshold: 900

RateLimit:
  Enabled: true
  RequestsPerSecond: 100
  Concurrency: 10

Telemetry:
  Name: bot-platform.rpc
  Endpoint: ${OTEL_ENDPOINT}
  Sampler: 1.0
  Batcher: otlpgrpc
