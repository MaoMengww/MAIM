Name: ai-bot-service
ListenOn: 0.0.0.0:50062

Etcd:
  Hosts:
  - 127.0.0.1:2379
  Key: ai-bot.rpc

Database:
  driver: postgres
  dsn: postgres://aim:aim123@localhost:5432/aim?sslmode=disable&search_path=bot
  maxOpenConn: 50
  maxIdleConn: 10
  maxLifetime: 3600

Redis:
  Host: localhost:6379
  Type: node
  Pass: ""
  Key: ai-bot.rpc

Kafka:
  brokers:
  - localhost:9092
  consumerGroup: ai-bot-service
  maxRetry: 3

Bot:
  maxContextMessages: 10
  maxToolRounds: 3
  workerPoolSize: 0
  requestTimeout: 120s

Milvus:
  host: localhost
  port: 19530
  database: aim

Memory:
  workerId: 8
  embeddingDim: 1536
  vectorCollection: bot_memory_facts_v1
  vectorTopKMult: 4
  Neo4j:
    uri: bolt://localhost:7687
    username: neo4j
    password: aim123
    database: neo4j

LlmGateway:
  Etcd:
    Hosts:
    - 127.0.0.1:2379
    Key: llm-gateway.rpc
  Timeout: 600000

MessageService:
  Etcd:
    Hosts:
    - 127.0.0.1:2379
    Key: message.rpc
  Timeout: 30000

KnowledgeBase:
  Etcd:
    Hosts:
    - 127.0.0.1:2379
    Key: knowledge-base.rpc
  Timeout: 600000

WsGateway:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: ws-gateway.rpc
  Timeout: 10000

BotPlatform:
  Etcd:
    Hosts:
    - 127.0.0.1:2379
    Key: bot-platform.rpc
  Timeout: 10000

UserService:
  Etcd:
    Hosts:
    - 127.0.0.1:2379
    Key: user.rpc
  Timeout: 10000

Log:
  Encoding: json
  Level: info
  Stat: false

CpuThreshold: 900

RateLimit:
  Enabled: true
  RequestsPerSecond: 100
  Concurrency: 10

Telemetry:
  Name: ai-bot.rpc
  Endpoint: localhost:4317
  Sampler: 1.0
  Batcher: otlpgrpc

Prometheus:
  Host: 0.0.0.0
  Port: 9106
