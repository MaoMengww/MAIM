Name: ai-bot-service
ListenOn: 0.0.0.0:50062

Database:
  driver: postgres
  dsn: ${POSTGRES_DSN_BASE}?sslmode=disable&search_path=bot
  maxOpenConn: 50
  maxIdleConn: 10
  maxLifetime: 3600

Redis:
  Host: ${REDIS_ADDR}
  Type: node
  Pass: ""
  Key: ai-bot.rpc

Kafka:
  brokers: ${KAFKA_BROKERS}
  consumerGroup: ai-bot-service
  maxRetry: 3

Bot:
  maxContextMessages: 10
  maxToolRounds: 3
  workerPoolSize: 0
  requestTimeout: 120s

Milvus:
  host: ${MILVUS_HOST}
  port: ${MILVUS_PORT}
  database: aim

Memory:
  workerId: 8
  embeddingDim: 1536
  vectorCollection: bot_memory_facts_v1
  vectorTopKMult: 4
  Neo4j:
    uri: ${NEO4J_URI}
    username: ${NEO4J_USER}
    password: ${NEO4J_PASSWORD}
    database: neo4j

LlmGateway:
  Target: ${LLM_GATEWAY_ADDR}
  Timeout: 600000

MessageService:
  Target: ${MESSAGE_SERVICE_ADDR}
  Timeout: 30000

KnowledgeBase:
  Target: ${KNOWLEDGE_BASE_ADDR}
  Timeout: 600000

WsGateway:
  Target: ${WS_GATEWAY_ADDR}
  Timeout: 10000

BotPlatform:
  Target: ${BOT_PLATFORM_ADDR}
  Timeout: 10000

UserService:
  Target: ${USER_SERVICE_ADDR}
  Timeout: 10000

Log:
  Encoding: json
  Level: info
  Stat: false

CpuThreshold: 900

RateLimit:
  Enabled: true
  RequestsPerSecond: 100
  Concurrency: 10

Telemetry:
  Name: ai-bot.rpc
  Endpoint: ${OTEL_ENDPOINT}
  Sampler: 1.0
  Batcher: otlpgrpc

Prometheus:
  Host: 0.0.0.0
  Port: 9106
