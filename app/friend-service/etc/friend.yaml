Name: friend.rpc
ListenOn: 0.0.0.0:50052
Database:
  driver: postgres
  dsn: ${POSTGRES_DSN_BASE}?sslmode=disable&search_path=friend
  maxOpenConn: 100
  maxIdleConn: 100
  maxLifetime: 3600
UserRPC:
  Target: ${USER_SERVICE_ADDR}

Log:
  Level: info
  Stat: false

CpuThreshold: 900
Middlewares:
  Breaker: true

RateLimit:
  Enabled: true
  RequestsPerSecond: 100
  Concurrency: 10

Telemetry:
  Name: friend.rpc
  Endpoint: ${OTEL_ENDPOINT}
  Sampler: 0
  Batcher: otlpgrpc

Prometheus:
  Host: 0.0.0.0
  Port: 9104
