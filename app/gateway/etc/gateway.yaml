Name: gateway
Host: 0.0.0.0
Port: 8080

JWT:
  Secret: ${JWT_SECRET}
  ExpireSec: 3600
  RefreshSec: 2592000

Services:
  UserServiceAddr: ${USER_SERVICE_ADDR}
  MessageServiceAddr: ${MESSAGE_SERVICE_ADDR}
  FileServiceAddr: ${FILE_SERVICE_ADDR}
  BotServiceAddr: ${BOT_SERVICE_ADDR}
  KnowledgeServiceAddr: ${KNOWLEDGE_BASE_ADDR}
  NotificationServiceAddr: ${SIGNALING_SERVICE_ADDR}
  LLMGatewayServiceAddr: ${LLM_GATEWAY_ADDR}

RateLimit:
  Enabled: false
  RequestsPerSecond: 100
  MessagePerSecond: 10

Timeout:
  DefaultMs: 15000
  BotMs: 60000

Redis:
  Host: ${REDIS_ADDR}
  Password: ""
  DB: 0
  PoolSize: 100

Metrics:
  Port: 9091

Log:
  Level: info
  Format: console

Telemetry:
  Name: gateway
  Endpoint: ${OTEL_ENDPOINT}
  Sampler: 1.0
