Name: gateway
Host: 0.0.0.0
Port: 8080

JWT:
  Secret: aim-dev-secret-key
  ExpireSec: 3600
  RefreshSec: 2592000

Etcd:
  Hosts:
    - 127.0.0.1:2379
  DialTimeout: 5
  TTL: 10

Services:
  UserServiceKey:        user.rpc
  FriendServiceKey:      friend.rpc
  ConversationServiceKey: conversation.rpc
  MessageServiceKey:     message.rpc
  FileServiceKey:        file.rpc
  BotPlatformServiceKey:  bot-platform.rpc
  KnowledgeServiceKey:   knowledge-base.rpc
  NotificationServiceKey: signaling-service.rpc
  AuditServiceKey:       audit.rpc
  AIBotServiceKey:       ai-bot.rpc
  LLMGatewayServiceKey:  llm-gateway.rpc

RateLimit:
  Enabled: false
  RequestsPerSecond: 100
  MessagePerSecond: 10

Timeout:
  DefaultMs: 15000
  BotMs: 60000

Redis:
  Host: localhost:6379
  Password: ""
  DB: 0
  PoolSize: 100

Metrics:
  Port: 9091

Log:
  Level: info
  Format: console

Telemetry:
  Name: gateway
  Endpoint: localhost:4317
  Sampler: 1.0
