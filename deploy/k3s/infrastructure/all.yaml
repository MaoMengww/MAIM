# PostgreSQL
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: postgres-pvc}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources: {requests: {storage: 10Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: aim-postgres}
spec:
  replicas: 1
  selector: {matchLabels: {app: aim-postgres}}
  template:
    metadata: {labels: {app: aim-postgres}}
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports: [{containerPort: 5432}]
          env:
            - {name: POSTGRES_USER, value: aim}
            - {name: POSTGRES_PASSWORD, value: aim123}
            - {name: POSTGRES_DB, value: aim}
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
      volumes: [{name: data, persistentVolumeClaim: {claimName: postgres-pvc}}]
---
apiVersion: v1
kind: Service
metadata: {name: aim-postgres}
spec:
  selector: {app: aim-postgres}
  ports: [{port: 5432}]

# Redis
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: redis-pvc}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources: {requests: {storage: 2Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: aim-redis}
spec:
  replicas: 1
  selector: {matchLabels: {app: aim-redis}}
  template:
    metadata: {labels: {app: aim-redis}}
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
