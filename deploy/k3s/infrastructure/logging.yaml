# Logging stack: Filebeat DaemonSet + Kibana

filebeat:
  daemonset:
    filebeatConfig:
      filebeat.yml: |
        filebeat.inputs:
          - type: container
            paths:
              - /var/log/containers/*.log
            processors:
              - add_kubernetes_metadata:
                  host: ${NODE_NAME}
                  matchers:
                    - logs_path:
                        logs_path: "/var/log/containers/"
              - drop_event:
                  when:
                    equals:
                      level: "stat"

        processors:
          - add_host_metadata: ~
          - add_cloud_metadata: ~

        output.elasticsearch:
          hosts: '["http://aim-elasticsearch.default.svc.cluster.local:9200"]'
          index: "aim-logs-%{+yyyy.MM.dd}"

kibana:
  elasticsearchHosts: "http://aim-elasticsearch.default.svc.cluster.local:9200"
  resources:
    requests:
      memory: "512Mi"
