# Runtime side of the bot domain: same image as bot-service, independent replica
# count so the agent runtime scales separately from the control plane.
replicaCount: 1
args: ["-f", "/app/etc/bot.yaml", "-role", "runtime"]
image:
  name: bot-service
service:
  grpcPort: 50058
  metricsPort: 9119
config:
  name: bot-runtime
  configFilename: bot
  extraEnv:
    BOT_METRICS_PORT: "9119"
