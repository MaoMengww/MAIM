apiVersion: v1
kind: Service
metadata:
  name: {{ include "aim-service.fullname" . }}
  labels:
    {{- include "aim-service.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  {{- if .Values.service.headless }}
  clusterIP: None
  {{- end }}
  selector:
    app: {{ include "aim-service.fullname" . }}
  ports:
    {{- if gt (int .Values.service.grpcPort) 0 }}
    - port: {{ .Values.service.grpcPort }}
      targetPort: grpc
      name: grpc
      protocol: TCP
    {{- end }}
    {{- if .Values.service.httpPort }}
    - port: {{ .Values.service.httpPort }}
      targetPort: http
      name: http
      protocol: TCP
    {{- end }}
    {{- if .Values.service.wsPort }}
    - port: {{ .Values.service.wsPort }}
      targetPort: ws
      name: ws
      protocol: TCP
    {{- end }}
    - port: {{ .Values.service.metricsPort }}
      targetPort: metrics
      name: metrics
      protocol: TCP
