apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aim-service.fullname" . }}
  labels:
    {{- include "aim-service.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "aim-service.fullname" . }}
  template:
    metadata:
      labels:
        app: {{ include "aim-service.fullname" . }}
        app.kubernetes.io/part-of: aim
    spec:
      containers:
        - name: {{ include "aim-service.fullname" . }}
          image: "{{ .Values.image.repository }}/aim-{{ .Values.config.name }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.grpcPort }}
              name: grpc
              protocol: TCP
            {{- if .Values.service.httpPort }}
            - containerPort: {{ .Values.service.httpPort }}
              name: http
              protocol: TCP
            {{- end }}
            {{- if .Values.service.wsPort }}
            - containerPort: {{ .Values.service.wsPort }}
              name: ws
              protocol: TCP
            {{- end }}
            - containerPort: {{ .Values.service.metricsPort }}
              name: metrics
              protocol: TCP
          env:
            {{- range $k, $v := .Values.environment }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- range $k, $v := .Values.config.extraEnv }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 5
            periodSeconds: 10
