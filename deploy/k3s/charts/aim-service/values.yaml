replicaCount: 1
args: []
terminationGracePeriodSeconds: 30

image:
  repository: docker.io/library
  tag: latest
  pullPolicy: Never
  name: ""

service:
  type: ClusterIP
  headless: true
  grpcPort: 50051
  metricsPort: 9101
  httpPort: null
  wsPort: null

# probes.httpPort switches liveness/readiness from a gRPC TCP socket to an HTTP
# GET (used by workloads that expose no gRPC listener, e.g. the RAG ingest worker).
probes:
  httpPort: null
  httpPath: /health
  readinessPath: /health

config:
  name: ""
  configFilename: ""
  extraEnv: {}
  secretEnv: {}

environment:
  POSTGRES_DSN_BASE: "postgres://aim:aim123@aim-postgres:5432/aim"
  REDIS_ADDR: "aim-redis:6379"
  KAFKA_BROKERS: "[aim-kafka:9092]"
  ELASTICSEARCH_ADDRESSES: "[http://aim-elasticsearch:9200]"
  MINIO_ENDPOINT: "aim-minio:9000"
  MINIO_PUBLIC_ENDPOINT: "localhost:9000"
  MINIO_ACCESS_KEY: "minioadmin"
  MINIO_SECRET_KEY: "minioadmin123"
  MILVUS_HOST: "aim-milvus"
  MILVUS_PORT: "19530"
  NEO4J_URI: "bolt://aim-neo4j:7687"
  NEO4J_USER: "neo4j"
  NEO4J_PASSWORD: "password123"
  OTEL_ENDPOINT: "aim-otel-collector:4317"
  MINERU_URL: "http://aim-mineru:30000"
  JWT_SECRET: "aim-dev-secret-key"
  ENC_KEY: "Ay+h5wU31Vfy5gITlP1P2cmNtOPkTsnqIupXHqpgutw="
  BOT_ENCRYPTION_KEY: ""
  BOT_METRICS_PORT: "9109"
  INGEST_REQUESTS_PER_SECOND: "5"
  INGEST_CONCURRENCY: "2"
  LLM_EMBED_ONLINE_RPM: "80"
  LLM_EMBED_ONLINE_CONCURRENCY: "8"
  LLM_EMBED_INGEST_RPM: "20"
  LLM_EMBED_INGEST_CONCURRENCY: "2"
  USER_SERVICE_ADDR: "dns:///aim-user-service:50051"
  MESSAGE_SERVICE_ADDR: "dns:///aim-message-service:50053"
  FILE_SERVICE_ADDR: "dns:///aim-file-service:50054"
  BOT_SERVICE_ADDR: "dns:///aim-bot-service:50058"
  BOT_RUNTIME_ADDR: "dns:///aim-bot-runtime:50058"
  KNOWLEDGE_BASE_ADDR: "dns:///aim-knowledge-base:50057"
  LLM_GATEWAY_ADDR: "dns:///aim-llm-gateway:50056"
  REALTIME_SERVICE_ADDR: "dns:///aim-realtime-service:50061"


resources:
  requests:
    memory: "64Mi"
    cpu: "100m"
  limits:
    memory: "256Mi"
    cpu: "500m"

ingress:
  enabled: false
  host: ""
  port: 8080
