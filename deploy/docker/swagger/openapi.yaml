          type: string
        created_at:
          type: integer
          format: int64

    GetSummariesResp:
      type: object
      properties:
        summaries:
          type: array
          items:
            $ref: '#/components/schemas/Summary'

    CreateTodoReq:
      type: object
      required:
        - title
      properties:
        title:
          type: string
        description:
          type: string
        assigned_to:
          type: integer
          format: int64
        due_at:
          type: integer
          format: int64

    Todo:
      type: object
      properties:
        id:
          type: integer
          format: int64
        conversation_id:
          type: integer
          format: int64
        title:
          type: string
        description:
          type: string
        assigned_to:
          type: integer
          format: int64
        status:
          type: string
          enum: [pending, in_progress, done]
        due_at:
          type: integer
          format: int64
        created_at:
          type: integer
          format: int64

    UpdateTodoReq:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        assigned_to:
          type: integer
          format: int64
        status:
          type: string
          enum: [pending, in_progress, done]
        due_at:
          type: integer
          format: int64

    ReplyCandidate:
      type: object
      properties:
        index:
          type: integer
        text:
          type: string
        tone:
          type: string

    ReplyCandidatesResp:
      type: object
      properties:
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/ReplyCandidate'

    TranslateReq:
      type: object
      required:
        - target_lang
      properties:
        target_lang:
          type: string
          example: zh-CN

    TranslateResp:
      type: object
      properties:
        original_text:
          type: string
        translated_text:
          type: string
        source_lang:
          type: string
        target_lang:
          type: string

    # ========== Wiki ==========
    WikiPage:
      type: object
      properties:
        slug:
          type: string
        title:
          type: string
        content:
          type: string
        parent_slug:
          type: string
        order:
          type: integer
        created_at:
          type: integer
          format: int64
        updated_at:
          type: integer
          format: int64

    WikiIndex:
      type: object
      properties:
        pages:
          type: array
          items:
            $ref: '#/components/schemas/WikiPage'
        issues_count:
          type: integer

    WikiIssue:
      type: object
      properties:
        id:
          type: integer
          format: int64
        slug:
          type: string
        severity:
          type: string
          enum: [info, warning, error]
        title:
          type: string
        description:
          type: string
        resolved:
          type: boolean
        created_at:
          type: integer
          format: int64

    WikiGraphResp:
      type: object
      properties:
        nodes:
          type: array
          items:
            type: object
            properties:
              slug:
                type: string
              title:
                type: string
        edges:
          type: array
          items:
            type: object
            properties:
              from:
                type: string
              to:
                type: string

    WikiUpdatePageReq:
      type: object
      properties:
        title:
          type: string
        content:
          type: string
        parent_slug:
          type: string
        order:
          type: integer

    WikiReplaceTextReq:
      type: object
      properties:
        old_text:
          type: string
        new_text:
          type: string

    WikiRenamePageReq:
      type: object
      required:
        - new_slug
      properties:
        new_slug:
          type: string

    WikiFlagIssueReq:
      type: object
      properties:
        slug:
          type: string
        severity:
          type: string
          enum: [info, warning, error]
        title:
          type: string
        description:
          type: string

    WikiUpdateIssueReq:
      type: object
      properties:
        resolved:
          type: boolean
        description:
          type: string

    # ========== User Extras ==========
    RechargeReq:
      type: object
      properties:
        amount:
          type: integer
          description: 充值金额（分）

    RechargeResp:
      type: object
      properties:
        balance:
          type: integer
          format: int64
          description: 充值后余额（分）

paths:
  # ==================== Health ====================
  /health:
    get:
      tags:
        - System
      summary: 健康检查
      operationId: health
      responses:
        "200":
          description: 服务正常
          content:
            text/plain:
              schema:
                type: string
                example: ok

  # ==================== Auth ====================
  /auth/register:
    post:
      tags:
        - Auth
      summary: 用户注册
      operationId: authRegister
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterReq'
      responses:
        "201":
          description: 注册成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - properties:
                      data:
                        $ref: '#/components/schemas/RegisterResp'
        "400":
          description: 参数错误

  /auth/login:
    post:
      tags:
        - Auth
      summary: 用户登录
      operationId: authLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginReq'
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - properties:
                      data:
                        $ref: '#/components/schemas/LoginResp'
        "401":
          description: 认证失败

  /auth/refresh:
    post:
      tags:
        - Auth
      summary: 刷新 Token
      operationId: authRefresh
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenReq'
      responses:
        "200":
          description: 刷新成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - properties:
                      data:
                        $ref: '#/components/schemas/RefreshTokenResp'

  /auth/oauth/{provider}:
    post:
      tags:
        - Auth
      summary: OAuth 第三方登录
      description: |
        ⚠️ **未完成**: 当前为占位实现，仅以 `{provider}_{code}` 拼接作为用户名创建/查找用户，
        未真正调用第三方 OAuth 提供商接口交换 token 或获取用户信息。
      operationId: authOAuthLogin
      x-unfinished: true
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            example: github
          description: OAuth 提供商 (github/google/...)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthLoginReq'
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - properties:
                      data:
                        $ref: '#/components/schemas/LoginResp'

  /auth/logout:
    post:
      tags:
        - Auth
      summary: 退出登录
      operationId: authLogout
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutReq'
      responses:
        "200":
          description: 退出成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - properties:
                      data:
                        $ref: '#/components/schemas/BaseResponse'

  /auth/sessions:
    get:
      tags:
        - Auth
      summary: 获取当前用户的会话列表
      operationId: authGetSessions
      security:
        - BearerAuth: []
      responses:
        "200":
          description: 会话列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - properties:
                      data:
                        $ref: '#/components/schemas/GetSessionsResp'

  /auth/sessions/{id}:
    delete:
      tags:
        - Auth
      summary: 吊销指定会话
      operationId: authRevokeSession
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: 会话 ID
      responses:
        "200":
          description: 吊销成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'

  # ==================== User ====================
  /users/me:
    get:
      tags:
        - User
      summary: 获取当前用户个人信息
      operationId: userGetProfile
      security:
        - BearerAuth: []
      responses:
        "200":
          description: 用户信息
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - properties:
                      data:
                        $ref: '#/components/schemas/UserInfo'
    put:
      tags:
        - User
      summary: 更新当前用户个人信息
      operationId: userUpdateProfile
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileReq'
      responses:
        "200":
          description: 更新后的用户信息
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - properties:
                      data:
                        $ref: '#/components/schemas/UserInfo'

  /users/me/password:
    put:
      tags:
        - User
      summary: 修改密码
      operationId: userUpdatePassword
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePasswordReq'
      responses:
        "200":
          description: 修改成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'

  /users/me/phone:
    put:
      tags:
        - User
      summary: 绑定手机号
      operationId: userBindPhone
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BindPhoneReq'
      responses:
        "200":
          description: 绑定成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'

  /users/me/email:
    put:
      tags:
        - User
      summary: 绑定邮箱
      operationId: userBindEmail
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BindEmailReq'
      responses:
        "200":
          description: 绑定成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'

  /users/{id}:
    get:
      tags:
        - User
      summary: 获取指定用户信息
      operationId: userGetUserInfo
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: 用户 ID
      responses:
        "200":
          description: 用户信息
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - properties:
                      data:
                        $ref: '#/components/schemas/UserInfo'
        "404":
          description: 用户不存在

  /users/batch:
    post:
      tags:
        - User
      summary: 批量获取用户信息
      operationId: userBatchGetUserInfo
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchGetUserInfoReq'
      responses:
        "200":
          description: 用户列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - properties:
                      data:
                        $ref: '#/components/schemas/BatchGetUserInfoResp'

  /users/search:
    post:
      tags:
        - User
      summary: 搜索用户
      operationId: userSearchUsers
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchUsersReq'
      responses:
        "200":
          description: 搜索结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - properties:
                      data:
                        $ref: '#/components/schemas/SearchUsersResp'

  /users/batch_status:
    post:
      tags:
        - User
      summary: 批量查询用户在线状态
      operationId: userBatchGetStatus
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchGetStatusReq'
      responses:
        "200":
          description: 在线状态列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - properties:
                      data:
                        $ref: '#/components/schemas/BatchGetStatusResp'

  /users/me/settings:
    get:
      tags:
        - User
      summary: 获取用户设置
      operationId: userGetSettings
      security:
        - BearerAuth: []
      responses:
        "200":
          description: 用户设置
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - properties:
                      data:
                        $ref: '#/components/schemas/GetSettingsResp'
    put:
      tags:
        - User
      summary: 更新用户设置
      operationId: userUpdateSettings
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSettingsReq'
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'

  # ==================== Friend ====================
  /friends/requests:
    post:
      tags:
        - Friend
      summary: 发送好友申请
      operationId: friendSendRequest
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendRequestReq'
      responses:
        "200":
          description: 发送成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - properties:
                      data:
                        $ref: '#/components/schemas/SendRequestResp'

  /friends/requests/pending:
    get:
      tags:
        - Friend
      summary: 获取待处理的好友申请列表
      operationId: friendListPendingRequests
      security:
        - BearerAuth: []
      responses:
        "200":
          description: 申请列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - properties:
                      data:
                        $ref: '#/components/schemas/ListRequestsResp'

  /friends/requests/sent:
    get:
      tags:
        - Friend
      summary: 获取已发送的好友申请列表
      operationId: friendListSentRequests
      security:
        - BearerAuth: []
      responses:
        "200":
          description: 申请列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - properties:
                      data:
                        $ref: '#/components/schemas/ListRequestsResp'

  /friends/requests/{id}/accept:
    post:
      tags:
        - Friend
      summary: 接受好友申请
      operationId: friendAcceptRequest
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: 好友申请 ID
      responses:
        "200":
          description: 接受成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'

  /friends/requests/{id}/reject:
    post:
      tags:
        - Friend
      summary: 拒绝好友申请
      operationId: friendRejectRequest
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: 好友申请 ID
      responses:
        "200":
          description: 拒绝成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'

  /friends/requests/{id}:
    delete:
      tags:
        - Friend
      summary: 取消好友申请
      operationId: friendCancelRequest
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: 好友申请 ID
      responses:
        "200":
          description: 取消成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'

  /friends:
    get:
      tags:
        - Friend
      summary: 获取好友列表
      operationId: friendListFriends
      security:
        - BearerAuth: []
      responses:
        "200":
          description: 好友列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - properties:
                      data:
                        $ref: '#/components/schemas/ListFriendsResp'

  /friends/{user_id}:
    delete:
      tags:
        - Friend
      summary: 删除好友
      operationId: friendDeleteFriend
      security:
        - BearerAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: 好友用户 ID
      responses:
        "200":
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'

  /friends/{user_id}/remark:
    put:
      tags:
        - Friend
      summary: 设置好友备注
      operationId: friendSetRemark
      security:
        - BearerAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: 好友用户 ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetRemarkReq'
      responses:
        "200":
          description: 设置成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'

  /friends/{user_id}/group:
    put:
      tags:
        - Friend
      summary: 将好友移动到指定分组
      operationId: friendSetGroup
      security:
        - BearerAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: 好友用户 ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetGroupReq'
      responses:
        "200":
          description: 移动成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'

  /friends/{user_id}/block:
    post:
      tags:
        - Friend
      summary: 拉黑用户
      operationId: friendBlockUser
      security:
        - BearerAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: 要拉黑的用户 ID
      responses:
        "200":
          description: 拉黑成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
    delete:
      tags:
        - Friend
      summary: 取消拉黑用户
      operationId: friendUnblockUser
      security:
        - BearerAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: 要取消拉黑的用户 ID
      responses:
        "200":
          description: 取消拉黑成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'

  /friends/groups:
    post:
      tags:
        - Friend
      summary: 创建好友分组
      operationId: friendCreateGroup
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGroupReq'
      responses:
        "200":
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - properties:
                      data:
                        $ref: '#/components/schemas/CreateGroupResp'
    get:
      tags:
        - Friend
      summary: 获取好友分组列表
      operationId: friendListGroups
      security:
        - BearerAuth: []
      responses:
        "200":
          description: 分组列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - properties:
                      data:
                        $ref: '#/components/schemas/ListGroupsResp'

  /friends/groups/{id}:
    put:
      tags:
        - Friend
      summary: 重命名好友分组
      operationId: friendRenameGroup
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: 分组 ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameGroupReq'
      responses:
        "200":
          description: 重命名成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
    delete:
      tags:
        - Friend
      summary: 删除好友分组
      operationId: friendDeleteGroup
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: 分组 ID
      responses:
        "200":
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'

  /friends/blacklist:
    get:
      tags:
        - Friend
      summary: 获取黑名单列表
      operationId: friendListBlacklist
      security:
        - BearerAuth: []
      responses:
        "200":
          description: 黑名单列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - properties:
                      data:
                        $ref: '#/components/schemas/ListBlacklistResp'

  # ==================== Conversation ====================
  /convs:
    post:
      tags:
        - Conversation
      summary: 创建会话（私聊/群聊）
      operationId: convCreateConversation
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConversationReq'
      responses:
        "201":
          description: 创建成功
          content:
            application/json:
