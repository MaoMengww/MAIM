    # ========== Knowledge Base ==========
    PipelineConfig:
      type: object
      properties:
        preset:
          type: string
          enum: [general, tech_doc, legal, customer_service, academic, custom]
        parsing:
          type: object
          properties:
            strategy:
              type: string
              enum: [builtin, mineru, self_developed, self_first, mineru_first]
            mineru_url:
              type: string
            preserve_structure:
              type: boolean
              default: true
            extract_headers_footers:
              type: boolean
              default: false
            table_mode:
              type: string
              enum: [text, markdown, ignore]
            image_mode:
              type: string
              enum: [ignore, ocr]
            max_file_size:
              type: integer
              format: int64
              description: 字节数，默认 10MB
            encoding_detection:
              type: boolean
              default: true
        chunking:
          type: object
          properties:
            strategy:
              type: string
              enum: [recursive, fixed_size, sentence, markdown]
            chunk_size:
              type: integer
              description: tokens，默认 512
            overlap:
              type: integer
              description: tokens，默认 128
            separators:
              type: array
              items:
                type: string
            header_level:
              type: integer
              minimum: 1
              maximum: 6
            min_chunk_size:
              type: integer
              default: 50
            parent_child:
              type: object
              properties:
                enabled:
                  type: boolean
                parent_size:
                  type: integer
                  description: tokens，默认 1024
                child_size:
                  type: integer
                  description: tokens，默认 256
                child_overlap:
                  type: integer
                  description: tokens，默认 64
        retrieval:
          type: object
          properties:
            mode:
              type: string
              enum: [vector, hybrid, fulltext]
            top_k:
              type: integer
              default: 5
            candidate_top_k:
              type: integer
              default: 20
            score_threshold:
              type: number
              format: float
              default: 0.7
            dense_weight:
              type: number
              format: float
              default: 0.7
            sparse_weight:
              type: number
              format: float
              default: 0.3
            rerank:
              type: object
              properties:
                enabled:
                  type: boolean
                model:
                  type: string
                  example: bge-reranker-v2-m3
                top_n:
                  type: integer
                  default: 20

