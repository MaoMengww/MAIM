  /users/me/recharge:
    post:
      tags:
        - User
      summary: 用户充值
      operationId: userRecharge
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RechargeReq'
      responses:
        "200":
          description: 充值成功
