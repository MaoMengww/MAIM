  # ==================== Webhook ====================
  /webhook:
    post:
      tags:
        - Bot
      summary: Bot Webhook 回调
      description: 第三方平台向 Bot 推送消息的 Webhook 入口。无 JWT 认证，通过请求签名校验身份。
      operationId: botWebhook
      parameters:
        - name: X-Bot-Token
          in: header
          required: true
          schema:
            type: string
          description: Bot Token
        - name: X-Signature
          in: header
          schema:
            type: string
          description: HMAC 签名
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                event:
                  type: string
                  description: 事件类型
                data:
                  type: object
                  description: 事件数据
      responses:
        "200":
          description: 回调处理成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
