        updated_at:
          type: string
          pattern: ^-?[0-9]+$
          description: protobuf int64 十进制字符串；不是业务序号
      required:
      - id
      - conv_id

    UpdateTodoReq:
      type: object
      properties:
        content:
          type: string
        done:
          type: boolean

    ReplyCandidate:
      type: object
      properties:
        index:
          type: integer
        text:
          type: string
        tone:
          type: string

    ReplyCandidatesResp:
      type: object
      properties:
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/ReplyCandidate'

    TranslateReq:
      type: object
      required:
        - target_lang
      properties:
        target_lang:
          type: string
          example: zh-CN

    TranslateResp:
      type: object
      properties:
        original_text:
          type: string
        translated_text:
          type: string
        source_lang:
          type: string
        target_lang:
          type: string

    # ========== User Extras ==========
    RechargeReq:
      type: object
      properties:
        amount:
          type: integer
          description: 充值金额（分）

    RechargeResp:
      type: object
      properties:
        balance:
          type: integer
          format: int64
          description: 充值后余额（分）

    ChunkInfo:
      type: object
      properties:
        id:
          type: string
          format: uuid
        doc_id:
          type: string
          format: uuid
        chunk_index:
          type: integer
          format: int32
        content:
          type: string
        token_count:
          type: integer
          format: int32
        metadata:
          type: string
        created_at:
          type: string
          pattern: ^-?[0-9]+$
          description: protobuf int64 十进制字符串；不是业务序号
      required:
      - id
      - doc_id
    AttachmentContent:
      type: object
      properties:
        file_id:
          type: string
          format: uuid
        duration:
          type: integer
          format: int32
      required:
      - file_id
    ReplyMessageSummary:
      type: object
      properties:
        message_id:
          type: string
          format: uuid
        sender_id:
          type: string
          format: uuid
          description: 缺失引用时省略；不得使用空字符串、"0" 或全零 UUID
        sender_type:
          type: string
        sender_name:
          type: string
        type:
          $ref: '#/components/schemas/MessageType'
        preview:
          type: string
        deleted:
          type: boolean
      required:
      - message_id
    MessagePaginationResp:
      type: object
      properties:
        next_cursor:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: JSON number；JavaScript 安全整数业务序号，不是实体身份
        has_more:
          type: boolean
        total:
          type: integer
          format: int64

paths:
  # ==================== Health ====================
  /health:
    get:
      tags:
        - System
      summary: 健康检查
      operationId: health
      responses:
        "200":
          description: 服务正常
          content:
            text/plain:
              schema:
                type: string
                example: ok

  # ==================== Auth ====================
  /auth/register:
    post:
      tags:
        - Auth
      summary: 用户注册
      operationId: authRegister
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterReq'
      responses:
        "201":
          description: 注册成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - properties:
                      data:
                        $ref: '#/components/schemas/RegisterResp'
        "400":
          description: 参数错误

  /auth/login:
    post:
      tags:
        - Auth
      summary: 用户登录
      operationId: authLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginReq'
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - properties:
                      data:
                        $ref: '#/components/schemas/LoginResp'
        "401":
          description: 认证失败

  /auth/refresh:
    post:
      tags:
        - Auth
      summary: 刷新 Token
      operationId: authRefresh
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenReq'
      responses:
        "200":
          description: 刷新成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - properties:
                      data:
                        $ref: '#/components/schemas/RefreshTokenResp'

  /auth/oauth/{provider}:
    post:
      tags:
        - Auth
      summary: OAuth 第三方登录
      description: |
        ⚠️ **未完成**: 当前为占位实现，仅以 `{provider}_{code}` 拼接作为用户名创建/查找用户，
        未真正调用第三方 OAuth 提供商接口交换 token 或获取用户信息。
      operationId: authOAuthLogin
      x-unfinished: true
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            example: github
          description: OAuth 提供商 (github/google/...)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthLoginReq'
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - properties:
                      data:
                        $ref: '#/components/schemas/LoginResp'

  /auth/logout:
    post:
      tags:
        - Auth
      summary: 退出登录
      operationId: authLogout
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutReq'
      responses:
        "200":
          description: 退出成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - properties:
                      data:
                        $ref: '#/components/schemas/BaseResponse'

  /auth/sessions:
    get:
      tags:
        - Auth
      summary: 获取当前用户的会话列表
      operationId: authGetSessions
      security:
        - BearerAuth: []
      responses:
        "200":
          description: 会话列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - properties:
                      data:
                        $ref: '#/components/schemas/GetSessionsResp'

  /auth/sessions/{id}:
    delete:
      tags:
        - Auth
      summary: 吊销指定会话
      operationId: authRevokeSession
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: 会话 ID
      responses:
        "200":
          description: 吊销成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'

  # ==================== User ====================
  /users/me:
    get:
      tags:
