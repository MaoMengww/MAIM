            application/json:
              schema:
                $ref: '#/components/schemas/Response'

  /convs/{id}/messages:
    get:
      tags:
      - Message
      summary: 会话可见消息历史
      operationId: getConversationMessages
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: 会话 UUID
      - name: cursor
        in: query
        schema:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: JSON number；JavaScript 安全整数业务序号
          default: 0
        description: 会话 seq 分页边界；0 为最新消息，不是实体 ID 或不透明字符串
      - name: limit
        in: query
        schema:
          type: integer
          default: 20
      responses:
        '200':
          description: 可见历史与数字 next_cursor
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Response'
                - properties:
                    data:
                      $ref: '#/components/schemas/GetMessagesResp'
        '400':
          description: 无效实体身份或非安全整数序号
