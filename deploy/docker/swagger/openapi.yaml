  /messages/sync:
    get:
      tags:
        - Message
      summary: 用户级跨会话同步与重建
      description: 用户 ID 仅来自 Bearer 鉴权，不接受请求 UID。位点为 0、未知或超过收件箱保留期时显式返回完整重建快照；正常增量按返回的 next_position 续拉，直到 has_more=false。收件箱保留期由 Message.inboxRetentionDays 配置（默认 30 天），回收不影响会话历史读取。
      operationId: msgSyncMessages
      security:
        - BearerAuth: []
      parameters:
      - name: position
        in: query
        schema:
          type: integer
          format: int64
          default: 0
          minimum: 0
          maximum: 9007199254740991
        description: 用户同步位点（不是会话 seq）；省略或 0 为新设备重建；安全整数范围内未知或过期位点按重建合同处理；空值、负数、分数或越界返回参数错误。
      - name: limit
        in: query
        schema:
          type: integer
          format: int32
          minimum: 0
          default: 50
        description: 增量每页数量或重建每会话历史数量；省略或 0 默认 50，上限为 Message.MaxPageSize（默认 100）。负数、空值、格式错误或 int32 溢出返回参数错误。
      responses:
        "200":
          description: 跨会话增量或显式重建快照
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - properties:
                      data:
                        $ref: '#/components/schemas/SyncMessagesResp'
        "400":
          description: position 或 limit 参数错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'

