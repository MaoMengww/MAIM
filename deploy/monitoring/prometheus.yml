global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']

  - job_name: 'gateway'
    metrics_path: /metrics
    static_configs:
      - targets: ['172.27.95.205:8080']

  - job_name: 'ws-gateway'
    static_configs:
      - targets: ['172.27.95.205:9110']

  - job_name: 'rpc-services'
    static_configs:
      - targets:
        - '172.27.95.205:9094'
        - '172.27.95.205:9101'
        - '172.27.95.205:9102'
        - '172.27.95.205:9103'
        - '172.27.95.205:9104'
        - '172.27.95.205:9105'
        - '172.27.95.205:9106'
        - '172.27.95.205:9107'
        - '172.27.95.205:9108'
        - '172.27.95.205:9109'
        - '172.27.95.205:9110'
