global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']

  # Gateway serves /metrics on its main HTTP listener (router registers the
  # handler on the same server that listens on 8080); the Metrics.Port config
  # field is not wired to a separate listener.
  - job_name: 'gateway'
    metrics_path: /metrics
    static_configs:
      - targets: ['aim-gateway:8080']

  - job_name: 'realtime-service'
    static_configs:
      - targets: ['aim-realtime-service:9103']

  - job_name: 'rpc-services'
    static_configs:
      - targets:
        - 'aim-user-service:9101'
        - 'aim-message-service:9102'
        - 'aim-file-service:9105'
        - 'aim-llm-gateway:9107'
        - 'aim-knowledge-base:9108'
        - 'aim-bot-service:9109'
        - 'aim-bot-runtime:9119'
        - 'aim-knowledge-ingest:9118'
