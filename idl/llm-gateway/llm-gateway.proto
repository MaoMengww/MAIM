syntax = "proto3";

package llmgateway;

option go_package = "github.com/maomeng/aim/app/llm-gateway/pb/llmgateway";

import "common/common.proto";

service LLMGateway {
  rpc Chat(ChatReq) returns (ChatResp);
  rpc ChatStream(ChatReq) returns (stream ChatStreamChunk);
  rpc ResolveExecutionModel(ResolveExecutionModelReq) returns (ModelExecutionConfig);
  rpc Embed(EmbedReq) returns (EmbedResp);
  rpc Rerank(RerankReq) returns (RerankResp);
  rpc Judge(JudgeReq) returns (JudgeResp);
  rpc ListModels(ListModelsReq) returns (ListModelsResp);
  rpc CreateModel(CreateModelReq) returns (ModelResp);
  rpc UpdateModel(UpdateModelReq) returns (ModelResp);
  rpc DeleteModel(DeleteModelReq) returns (DeleteModelResp);
  rpc ListConnections(ListConnectionsReq) returns (ListConnectionsResp);
  rpc CreateConnection(CreateConnectionReq) returns (ConnectionResp);
  rpc UpdateConnection(UpdateConnectionReq) returns (ConnectionResp);
  rpc DeleteConnection(DeleteConnectionReq) returns (DeleteConnectionResp);
  rpc ListQuotaPools(ListQuotaPoolsReq) returns (ListQuotaPoolsResp);
  rpc CreateQuotaPool(CreateQuotaPoolReq) returns (QuotaPoolResp);
  rpc UpdateQuotaPool(UpdateQuotaPoolReq) returns (QuotaPoolResp);
  rpc DeleteQuotaPool(DeleteQuotaPoolReq) returns (DeleteQuotaPoolResp);
  rpc GetBillingStats(BillingStatsReq) returns (BillingStatsResp);
  rpc VlmChat(VlmChatReq) returns (ChatResp);
  rpc ListBillingRecords(ListBillingRecordsReq) returns (ListBillingRecordsResp);
}

message VlmChatReq {
  string model_id = 1 [(common.entity_id) = true];
  string system_prompt = 2;
  string user_prompt = 3;
  string image_data = 4; // base64 data URL e.g. "data:image/png;base64,..."
  double temperature = 5;
  int32 max_tokens = 6;
  optional string owner_id = 7 [(common.entity_id) = true];
  optional string bot_id = 8 [(common.entity_id) = true];
}

message ToolDef {
  string name = 1;
  string description = 2;
  bytes parameters = 3; // JSON Schema as raw JSON bytes
}

message ChatReq {
  string model_id = 1 [(common.entity_id) = true];              // model registry ID
  repeated Message messages = 3;
  double temperature = 4;
  int32 max_tokens = 5;
  double top_p = 6;
  repeated string stop = 7;
  optional string bot_id = 8 [(common.entity_id) = true];
  optional string owner_id = 9 [(common.entity_id) = true];
  repeated ToolDef tools = 10;     // tool definitions for function calling
  string cache_scope = 11; // Stable, non-secret authorization/interaction scope.
  ModelExecutionConfig execution_model = 12;
  optional string run_id = 13 [(common.entity_id) = true]; // Current AIM work authority; not a framework checkpoint.
  int64 execution_generation = 14;
  int64 input_version = 15;
}

message Message {
  string role = 1;
  string content = 2;
  string name = 3;
  repeated ToolCall tool_calls = 4;
  string tool_call_id = 5;
  string reasoning_content = 6; // Private provider trajectory; never public Run content.
}

message ToolCall {
  string id = 1;
  string type = 2;
  message Function {
    string name = 1;
    string arguments = 2;
  }
  Function function = 3;
  optional int32 index = 4; // Provider index on streaming tool-call deltas.
}

message ChatResp {
  string id = 1;
  string model = 2;
  message Choice {
    int32 index = 1;
    Message message = 2;
    string finish_reason = 3;
  }
  repeated Choice choices = 3;
  UsageInfo usage = 4;
  optional int64 first_token_latency_ms = 5;
}

message ChatStreamChunk {
  string id = 1;
  string model = 2;
  message Choice {
    int32 index = 1;
    Message delta = 2;
    string finish_reason = 3;
  }
  repeated Choice choices = 3;
  UsageInfo usage = 4;
  optional int64 first_token_latency_ms = 5;
}

message UsageInfo {
  int32 prompt_tokens = 1;
  int32 completion_tokens = 2;
  int32 total_tokens = 3;
  optional int32 cached_input_tokens = 4;
  optional int32 cache_write_tokens = 5;
}

message ResolveExecutionModelReq {
  string model_id = 1 [(common.entity_id) = true];
  optional string bot_id = 2 [(common.entity_id) = true];
  optional string owner_id = 3 [(common.entity_id) = true];
}

message ModelExecutionConfig {
  string model_id = 1 [(common.entity_id) = true];
  string model_name = 2;
  string provider = 3;
  string base_url = 4;
  string version = 5; // Gateway-authenticated routing/adapter version, no credentials.
}

message EmbedReq {
  string model_id = 1 [(common.entity_id) = true];              // model registry ID
  repeated string input = 3;
  optional string bot_id = 4 [(common.entity_id) = true];
  optional string owner_id = 5 [(common.entity_id) = true];
}

message EmbedResp {
  string model = 1;
  message Embedding {
    int32 index = 1;
    repeated float embedding = 2;
  }
  repeated Embedding data = 3;
  UsageInfo usage = 4;
}

message RerankReq {
  string model_id = 1 [(common.entity_id) = true];              // model registry ID
  string query = 2;
  repeated string documents = 3;
  int32 top_n = 4;
  bool return_documents = 5;
  optional string bot_id = 6 [(common.entity_id) = true];
  optional string owner_id = 7 [(common.entity_id) = true];
}

message RerankResp {
  message Result {
    int32 index = 1;
    float relevance_score = 2;
    string document = 3;
  }
  repeated Result results = 1;
  string model = 2;
  UsageInfo usage = 3;
}

// Text-only structured judgment. Names correlate answers, independent of ordering.
message JudgeReq {
  string model_id = 1 [(common.entity_id) = true];
  string state = 2;
  map<string, JudgeQuestion> questions = 3;
  optional string bot_id = 4 [(common.entity_id) = true];
  optional string owner_id = 5 [(common.entity_id) = true];
}

message JudgeQuestion {
  string instructions = 1;
  oneof kind {
    NoulQuestion noul = 2;
    ChoiceQuestion choice = 3;
    ScoreQuestion score = 4;
  }
}

message NoulQuestion {
  optional string false_criteria = 1;
  optional string true_criteria = 2;
}

message ChoiceQuestion {
  map<string, string> criteria = 1;
}

message ScoreQuestion {
  repeated string criteria = 1; // Ordered levels, indexed from zero.
}

message JudgeAnswer {
  oneof kind {
    NoulAnswer noul = 1;
    ChoiceAnswer choice = 2;
    ScoreAnswer score = 3;
  }
}

message NoulAnswer {
  double probability = 1; // Probability of yes/true, in [0,1].
}

message ChoiceAnswer {
  string choice = 1;
  map<string, double> probabilities = 2;
  optional double confidence = 3;
  map<string, string> criteria = 4;
}

message ScoreAnswer {
  double score = 1; // Probability-weighted zero-based level index.
  map<string, double> probabilities = 2;
  map<string, string> legend = 3;
  optional double confidence = 4;
}

message JudgeUsage {
  optional int32 input_tokens = 1; // Absence means unknown, never zero.
  optional int32 output_tokens = 2;
}

message JudgeResp {
  string model = 1; // Actual provider-reported version.
  map<string, JudgeAnswer> answers = 2;
  JudgeUsage usage = 3;
}

message ListModelsReq {
  string capability = 1;
  optional string owner_id = 2 [(common.entity_id) = true];
}

message ListModelsResp {
  repeated ModelResp items = 1;
  int32 total = 2;
}

message CreateModelReq {
  string model_name = 1;
  reserved 2;
  reserved "provider";
  string capability = 3;
  reserved 4, 5;
  reserved "base_url", "api_key";
  double input_price_per_mtok = 6;
  double output_price_per_mtok = 7;
  optional string owner_id = 8 [(common.entity_id) = true];
  string owner_type = 9; // platform | user；平台不提供 owner_id，用户所有必须提供有效 owner_id
  string connection_id = 10 [(common.entity_id) = true];
  CapacityLimits model_limits = 11;
}

message UpdateModelReq {
  string model_id = 1 [(common.entity_id) = true];
  string model_name = 2;
  reserved 3;
  reserved "provider";
  string capability = 4;
  reserved 5, 6;
  reserved "base_url", "api_key";
  optional double input_price_per_mtok = 7;
  optional double output_price_per_mtok = 8;
  optional string connection_id = 9 [(common.entity_id) = true];
  CapacityLimits model_limits = 10;
}

message DeleteModelReq {
  string model_id = 1 [(common.entity_id) = true];
}

message DeleteModelResp {
  bool success = 1;
}

message ModelResp {
  string id = 1 [(common.entity_id) = true];
  string model_name = 2;
  string provider = 3;
  string capability = 4;
  string base_url = 5;
  optional string owner_id = 6 [(common.entity_id) = true];
  string status = 7;
  double input_price_per_mtok = 8;
  double output_price_per_mtok = 9;
  reserved 10;
  reserved "api_key";
  string owner_type = 11; // platform | user；与 provider、model_name 专用语义键无关
  string connection_id = 12 [(common.entity_id) = true];
  string quota_pool_id = 13 [(common.entity_id) = true];
  CapacityLimits pool_limits = 14;
  CapacityLimits model_limits = 15;
}

// Zero disables a supply dimension; negative values are invalid. Omitted model
// limits mean no model sublimit, never an implicit supplier quota.
message CapacityLimits {
  int32 requests_per_minute = 1;
  int32 requests_per_second = 2;
  int32 tokens_per_second = 3;
  int32 concurrency = 4;
}

message ListConnectionsReq { int32 page = 1; int32 page_size = 2; }
message ListConnectionsResp { repeated ConnectionResp items = 1; int32 total = 2; }
message CreateConnectionReq {
  string name = 1;
  string provider = 2;
  string base_url = 3;
  string api_key = 4; // Write-only. Never returned by any management response.
  optional string quota_pool_id = 5 [(common.entity_id) = true];
}
message UpdateConnectionReq {
  string connection_id = 1 [(common.entity_id) = true];
  optional string name = 2;
  optional string provider = 3;
  optional string base_url = 4;
  optional string api_key = 5; // Present means rotate (including empty key).
  optional string quota_pool_id = 6 [(common.entity_id) = true];
}
message DeleteConnectionReq { string connection_id = 1 [(common.entity_id) = true]; }
message DeleteConnectionResp { bool success = 1; }
message ConnectionResp {
  string id = 1 [(common.entity_id) = true];
  string name = 2;
  string provider = 3;
  string base_url = 4;
  string quota_pool_id = 5 [(common.entity_id) = true];
  optional string owner_id = 6 [(common.entity_id) = true];
  string owner_type = 7;
}
message ListQuotaPoolsReq { int32 page = 1; int32 page_size = 2; }
message ListQuotaPoolsResp { repeated QuotaPoolResp items = 1; int32 total = 2; }
message CreateQuotaPoolReq { string name = 1; CapacityLimits limits = 2; }
message UpdateQuotaPoolReq {
  string quota_pool_id = 1 [(common.entity_id) = true];
  optional string name = 2;
  CapacityLimits limits = 3; // Present replaces all four dimensions.
}
message DeleteQuotaPoolReq { string quota_pool_id = 1 [(common.entity_id) = true]; }
message DeleteQuotaPoolResp { bool success = 1; }
message QuotaPoolResp {
  string id = 1 [(common.entity_id) = true];
  string name = 2;
  CapacityLimits limits = 3;
  optional string owner_id = 4 [(common.entity_id) = true];
  string owner_type = 5;
}

message BillingStatsReq {
  string owner_id = 1 [(common.entity_id) = true];
  optional string bot_id = 2 [(common.entity_id) = true];
}

message BillingStatsResp {
  int64 total_input_tokens = 1;
  int64 total_output_tokens = 2;
  double total_cost = 3;
  repeated BillingModelStat by_model = 4;
}

message BillingModelStat {
  string model_name = 1;
  string capability = 2;
  int64 input_tokens = 3;
  int64 output_tokens = 4;
  double total_cost = 5;
}

message ListBillingRecordsReq {
  string owner_id = 1 [(common.entity_id) = true];
  int32 page = 2;
  int32 page_size = 3;
}

message BillingRecordItem {
  string id = 1 [(common.entity_id) = true];
  optional string bot_id = 2 [(common.entity_id) = true];
  string model_name = 3;
  string capability = 4;
  // Absent means the provider did not report this count; explicit zero is known.
  optional int32 input_tokens = 5;
  optional int32 output_tokens = 6;
  double input_cost = 7;
  double output_cost = 8;
  double total_cost = 9;
  string provider = 10;
  string created_at = 11;
  string model_id = 12 [(common.entity_id) = true];
  optional string owner_id = 13 [(common.entity_id) = true];
  string owner_type = 14;
}

message ListBillingRecordsResp {
  repeated BillingRecordItem items = 1;
  int32 total = 2;
}
