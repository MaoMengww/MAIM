syntax = "proto3";

package bot;

import "common/common.proto";

option go_package = "github.com/maomeng/aim/app/bot-service/pb/bot";

service BotService {
  // ========== Bot CRUD ==========
  rpc CreateBot(CreateBotReq) returns (CreateBotResp);
  rpc UpdateBot(UpdateBotReq) returns (common.BaseResponse);
  rpc DeleteBot(DeleteBotReq) returns (common.BaseResponse);
  rpc GetBot(GetBotReq) returns (GetBotResp);
  rpc ListBots(ListBotsReq) returns (ListBotsResp);
  rpc SearchBots(SearchBotsReq) returns (SearchBotsResp);

  // ========== Bot Reply ==========
  rpc RequestReply(RequestReplyReq) returns (RequestReplyResp);
  rpc StreamReply(StreamReplyReq) returns (stream StreamReplyChunk);
  rpc CancelReply(CancelReplyReq) returns (common.BaseResponse);

  // ========== Bot Session ==========
  rpc GetSession(GetSessionReq) returns (GetSessionResp);
  rpc ClearSession(ClearSessionReq) returns (common.BaseResponse);
  rpc ListSessions(ListSessionsReq) returns (ListSessionsResp);

  // ========== Memory ==========
  rpc GetMemory(GetMemoryReq) returns (GetMemoryResp);
  rpc ClearMemory(ClearMemoryReq) returns (common.BaseResponse);

  // ========== Capabilities ==========
  rpc Summarize(SummarizeReq) returns (SummarizeResp);
  rpc ExtractTodo(ExtractTodoReq) returns (ExtractTodoResp);
  rpc GenerateCandidates(GenerateCandidatesReq) returns (GenerateCandidatesResp);

  // ========== MCP Tools ==========
  rpc ListTools(common.Empty) returns (ListToolsResp);
  rpc ExecuteTool(ExecuteToolReq) returns (ExecuteToolResp);

  // ========== Knowledge Binding ==========
  rpc BindKnowledge(BindKnowledgeReq) returns (common.BaseResponse);
  rpc UnbindKnowledge(UnbindKnowledgeReq) returns (common.BaseResponse);
}

// ========== Enums ==========

enum BotStatus {
  BOT_STATUS_UNSPECIFIED = 0;
  BOT_STATUS_ACTIVE = 1;
  BOT_STATUS_INACTIVE = 2;
}

enum BotVisibility {
  BOT_VISIBILITY_UNSPECIFIED = 0;
  BOT_VISIBILITY_PRIVATE = 1;
  BOT_VISIBILITY_SHARED = 2;
  BOT_VISIBILITY_PUBLIC = 3;
}

// ========== Bot Entity ==========

message Bot {
  int64 bot_id = 1;
  string name = 2;
  string avatar = 3;
  string description = 4;
  int64 owner_id = 5;
  BotStatus status = 6;
  BotVisibility visibility = 7;
  BotConfig config = 8;
  int32 conversation_count = 9;
  int64 created_at = 10;
  int64 updated_at = 11;
}

// ========== Bot Config ==========

message BotConfig {
  string system_prompt = 1;
  string model_id = 2;
  common.Provider provider = 3;
  float temperature = 4;
  int32 max_tokens = 5;
  float top_p = 6;
  repeated string stop_sequences = 7;
  int32 max_context_messages = 8;
  int32 max_context_tokens = 9;
  bool knowledge_enabled = 10;
  int32 top_k_chunks = 11;
  float relevance_threshold = 12;
  repeated string enabled_tools = 13;
  int32 max_replies_per_user_per_hour = 14;
  string extra_json = 15;
}

// ========== Create Bot ==========

message CreateBotReq {
  string name = 1;
  int64 owner_id = 2;
  optional string avatar = 3;
  optional string description = 4;
  BotVisibility visibility = 5;
  BotConfig config = 6;
}

message CreateBotResp {
  int64 bot_id = 1;
  Bot bot = 2;
}

// ========== Update Bot ==========

message UpdateBotReq {
  int64 bot_id = 1;
  int64 user_id = 2;
  optional string name = 3;
  optional string avatar = 4;
  optional string description = 5;
  optional BotStatus status = 6;
  optional BotVisibility visibility = 7;
  optional BotConfig config = 8;
}

// ========== Delete Bot ==========

message DeleteBotReq {
  int64 bot_id = 1;
  int64 user_id = 2;
}

// ========== Get Bot ==========

message GetBotReq {
  int64 bot_id = 1;
}

message GetBotResp {
  Bot bot = 1;
}

// ========== List Bots ==========

message ListBotsReq {
  int64 user_id = 1;
  optional BotStatus status = 2;
  common.Pagination pagination = 3;
}

message ListBotsResp {
  repeated Bot bots = 1;
  common.PaginationResp pagination = 2;
}

// ========== Search Bots ==========

message SearchBotsReq {
  string keyword = 1;
  BotVisibility visibility = 2;
  common.Pagination pagination = 3;
}

message SearchBotsResp {
  repeated Bot bots = 1;
  common.PaginationResp pagination = 2;
}

// ========== Request Reply (non-streaming) ==========

message RequestReplyReq {
  int64 bot_id = 1;
  int64 conversation_id = 2;
  int64 user_id = 3;
  int64 message_id = 4;
}

message BotMessage {
  string role = 1;                // user / bot / system
  string content = 2;
  int64 message_id = 3;
  int64 timestamp = 4;
}

message RequestReplyResp {
  int64 reply_id = 1;
  string content = 2;
  string model_id = 3;
  int32 input_tokens = 4;
  int32 output_tokens = 5;
  int64 thinking_time_ms = 6;
}

// ========== Stream Reply ==========

message StreamReplyReq {
  int64 bot_id = 1;
  int64 conversation_id = 2;
  int64 user_id = 3;
  string message = 4;
}

message StreamReplyChunk {
  int64 reply_id = 1;
  string delta = 2;
  int32 chunk_index = 3;
  bool is_finish = 4;
  string finish_reason = 5;       // stop / length / error
  int32 input_tokens = 6;
  int32 output_tokens = 7;
}

// ========== Cancel Reply ==========

message CancelReplyReq {
  int64 reply_id = 1;
  int64 bot_id = 2;
  int64 user_id = 3;
}

// ========== Bot Session ==========

message GetSessionReq {
  int64 bot_id = 1;
  int64 conversation_id = 2;
}

message BotSession {
  int64 bot_id = 1;
  int64 conversation_id = 2;
  repeated BotMessage history = 3;
  int32 total_turns = 4;
  int64 last_active_at = 5;
  int64 created_at = 6;
}

message GetSessionResp {
  BotSession session = 1;
}

message ClearSessionReq {
  int64 bot_id = 1;
  int64 conversation_id = 2;
  int64 user_id = 3;
}

message ListSessionsReq {
  int64 bot_id = 1;
  int64 user_id = 2;
  common.Pagination pagination = 3;
}

message SessionSummary {
  int64 conversation_id = 1;
  string title = 2;
  int32 total_turns = 3;
  int64 last_active_at = 4;
  int64 created_at = 5;
}

message ListSessionsResp {
  repeated SessionSummary sessions = 1;
  common.PaginationResp pagination = 2;
}

// ========== Memory ==========

message GetMemoryReq {
  int64 bot_id = 1;
  optional int64 user_id = 2;
  optional int64 conversation_id = 3;
  common.Pagination pagination = 4;
}

message MemoryEntry {
  int64 id = 1;
  int64 bot_id = 2;
  int64 user_id = 3;
  int64 conversation_id = 4;
  string memory_type = 5;        // preference/profile/fact/summary
  string content = 6;            // JSON
  int32 importance = 7;
  int64 created_at = 8;
  int64 updated_at = 9;
}

message GetMemoryResp {
  repeated MemoryEntry memories = 1;
  common.PaginationResp pagination = 2;
}

message ClearMemoryReq {
  int64 bot_id = 1;
  optional int64 user_id = 2;
  optional int64 conversation_id = 3;
}

// ========== Summarize ==========

message SummarizeReq {
  int64 bot_id = 1;
  int64 conversation_id = 2;
  int64 user_id = 3;
  optional int32 max_messages = 4;   // limit messages to summarize
}

message SummarizeResp {
  string summary = 1;
  int32 message_count = 2;
  int32 input_tokens = 3;
  int32 output_tokens = 4;
}

// ========== Extract Todo ==========

message ExtractTodoReq {
  int64 bot_id = 1;
  int64 conversation_id = 2;
  int64 user_id = 3;
}

message TodoItem {
  string content = 1;
  string priority = 2;           // high/medium/low
  optional string assignee = 3;
  optional int64 deadline = 4;
}

message ExtractTodoResp {
  repeated TodoItem todos = 1;
}

// ========== Generate Candidates ==========

message GenerateCandidatesReq {
  int64 bot_id = 1;
  int64 conversation_id = 2;
  int64 user_id = 3;
  int32 count = 4;               // number of candidates (default 3)
}

message CandidateReply {
  int64 reply_id = 1;
  string text = 2;
  string tone = 3;               // friendly/formal/humorous/etc.
}

message GenerateCandidatesResp {
  repeated CandidateReply candidates = 1;
}

// ========== MCP Tools ==========

message ListToolsResp {
  repeated ToolInfo tools = 1;
}

message ToolInfo {
  string name = 1;
  string description = 2;
  string parameters_schema = 3;  // JSON Schema
}

message ExecuteToolReq {
  int64 bot_id = 1;
  string tool_name = 2;
  string arguments = 3;          // JSON string
  int64 user_id = 4;
}

message ExecuteToolResp {
  string tool_name = 1;
  string result = 2;             // JSON string
  int64 took_ms = 3;
}

// ========== Knowledge Binding ==========

message BindKnowledgeReq {
  int64 bot_id = 1;
  int64 knowledge_id = 2;
  int64 user_id = 3;
}

message UnbindKnowledgeReq {
  int64 bot_id = 1;
  int64 knowledge_id = 2;
  int64 user_id = 3;
}
