syntax = "proto3";

package message;

import "common/common.proto";

option go_package = "github.com/maomeng/aim/app/message-service/pb/message";

service MessageService {
  // ========== Core ==========
  rpc SendMessage(SendMessageReq) returns (SendMessageResp);
  rpc RecallMessage(RecallMessageReq) returns (common.BaseResponse);
  rpc EditMessage(EditMessageReq) returns (common.BaseResponse);
  rpc DeleteMessage(DeleteMessageReq) returns (common.BaseResponse);

  // ========== Query ==========
  rpc GetMessages(GetMessagesReq) returns (GetMessagesResp);
  rpc SyncMessages(SyncMessagesReq) returns (SyncMessagesResp);
  rpc GetMessageByID(GetMessageByIDReq) returns (GetMessageByIDResp);
  rpc BatchGetMessages(BatchGetMessagesReq) returns (BatchGetMessagesResp);
  rpc GetAroundSeq(GetAroundSeqReq) returns (GetMessagesResp);
  rpc SearchMessages(SearchMessagesReq) returns (SearchMessagesResp);

  // ========== Broadcast ==========
  rpc SendBroadcast(SendBroadcastReq) returns (SendBroadcastResp);

  // ========== Bot Reply (called by bot-service) ==========
  rpc SendBotReply(SendBotReplyReq) returns (SendBotReplyResp);
  rpc SendSystemMessage(SendSystemMessageReq) returns (SendMessageResp);

  // ========== Conversation domain ==========
  // ========== CRUD ==========
  rpc CreateConversation(CreateConversationReq) returns (CreateConversationResp);
  rpc GetConversation(GetConversationReq) returns (GetConversationResp);
  rpc ListConversations(ListConversationsReq) returns (ListConversationsResp);
  rpc UpdateConversation(UpdateConversationReq) returns (common.BaseResponse);
  rpc DeleteConversation(DeleteConversationReq) returns (common.BaseResponse);

  // ========== Members ==========
  rpc AddMembers(AddMembersReq) returns (AddMembersResp);
  rpc RemoveMembers(RemoveMembersReq) returns (common.BaseResponse);
  rpc GetMembers(GetMembersReq) returns (GetMembersResp);
  rpc UpdateMember(UpdateMemberReq) returns (common.BaseResponse);

  // ========== Group Management ==========
  rpc MuteAll(MuteAllReq) returns (common.BaseResponse);
  rpc UnmuteAll(UnmuteAllReq) returns (common.BaseResponse);
  rpc MuteMember(MuteMemberReq) returns (common.BaseResponse);
  rpc UnmuteMember(UnmuteMemberReq) returns (common.BaseResponse);
  rpc SetAnnouncement(SetAnnouncementReq) returns (common.BaseResponse);
  rpc DeleteAnnouncement(DeleteAnnouncementReq) returns (common.BaseResponse);
  rpc TransferOwner(TransferOwnerReq) returns (common.BaseResponse);

  // ========== Settings ==========
  rpc GetSettings(GetSettingsReq) returns (GetSettingsResp);
  rpc UpdateSettings(UpdateSettingsReq) returns (common.BaseResponse);

  // ========== Read Status ==========
  rpc MarkAsRead(MarkAsReadReq) returns (common.BaseResponse);
  rpc GetReadStatus(GetReadStatusReq) returns (GetReadStatusResp);
  rpc SendTypingEvent(SendTypingEventReq) returns (SendTypingEventResp);

  // ========== Bot Management ==========
  rpc AddBot(AddBotReq) returns (common.BaseResponse);
  rpc RemoveBot(RemoveBotReq) returns (common.BaseResponse);
  rpc UpdateBot(UpdateBotReq) returns (common.BaseResponse);
  rpc ListBots(ListBotsReq) returns (ListBotsResp);
}

// ========== Enums ==========

enum MessageType {
  MESSAGE_TYPE_UNSPECIFIED = 0;
  MESSAGE_TYPE_TEXT = 1;
  MESSAGE_TYPE_IMAGE = 2;
  MESSAGE_TYPE_FILE = 3;
  MESSAGE_TYPE_VIDEO = 4;
  MESSAGE_TYPE_AUDIO = 5;
  MESSAGE_TYPE_LOCATION = 6;
  MESSAGE_TYPE_SYSTEM = 7;
  MESSAGE_TYPE_CUSTOM = 8;
  MESSAGE_TYPE_BOT = 9;
}

enum MessageStatus {
  MESSAGE_STATUS_UNSPECIFIED = 0;
  MESSAGE_STATUS_NORMAL = 1;
  MESSAGE_STATUS_RECALLED = 2;
  MESSAGE_STATUS_EDITED = 3;
  MESSAGE_STATUS_STREAMING = 4;     // AI streaming in progress
}

message ReplyMessageSummary {
  string message_id = 1 [(common.entity_id) = true];
  optional string sender_id = 2 [(common.entity_id) = true];
  string sender_type = 3;
  string sender_name = 4;
  MessageType type = 5;
  string preview = 6;
  bool deleted = 7;
}

// ========== Content Types ==========

message TextContent {
  string text = 1;
  repeated string mention_user_ids = 2 [(common.entity_id) = true];
  bool mention_all = 3;
}

message ImageContent {
  string file_id = 1 [(common.entity_id) = true];
  string url = 2;
  string thumbnail_url = 3;
  int32 width = 4;
  int32 height = 5;
  int64 size = 6;
  string format = 7;
}

message FileContent {
  string file_id = 1 [(common.entity_id) = true];
  string url = 2;
  string name = 3;
  int64 size = 4;
  string ext = 5;
  string mime_type = 6;
}

message VideoContent {
  string file_id = 1 [(common.entity_id) = true];
  string url = 2;
  string thumbnail_url = 3;
  int32 duration = 4;
  int32 width = 5;
  int32 height = 6;
  int64 size = 7;
}

message AudioContent {
  string file_id = 1 [(common.entity_id) = true];
  string url = 2;
  int32 duration = 3;
  int64 size = 4;
}

// Generic attachment input; the message domain resolves type and metadata.
message AttachmentContent {
  string file_id = 1 [(common.entity_id) = true];
  int32 duration = 2;
}

message LocationContent {
  double latitude = 1;
  double longitude = 2;
  string address = 3;
  string name = 4;
}

message SystemContent {
  string action = 1;
  string detail = 2;
  repeated string related_user_ids = 3 [(common.entity_id) = true];
  optional string actor_id = 4 [(common.entity_id) = true];
  string actor_type = 5;
  string payload = 6;
}

message BotContent {
  string bot_id = 1 [(common.entity_id) = true];
  string bot_name = 2;
  string bot_avatar = 3;
  string text = 4;
  bool is_streaming = 5;
  int32 thinking_time_ms = 6;
  string raw_payload = 7;         // JSON: model, tokens, etc.
}

message CustomContent {
  string type = 1;
  string data = 2;
}

// ========== Message Entity ==========

message Message {
  string message_id = 1 [(common.entity_id) = true];
  string conversation_id = 2 [(common.entity_id) = true];
  int64 seq = 3 [(common.safe_sequence) = true];
  optional string from_user_id = 4 [(common.entity_id) = true];
  MessageType type = 5;
  MessageStatus status = 6;

  oneof content {
    TextContent text = 10;
    ImageContent image = 11;
    FileContent file = 12;
    VideoContent video = 13;
    AudioContent audio = 14;
    LocationContent location = 15;
    SystemContent system = 16;
    BotContent bot = 17;
    CustomContent custom = 18;
  }

  optional string reply_to_id = 20 [(common.entity_id) = true];
  ReplyMessageSummary reply_to = 21;

  int64 edited_at = 25;
  int32 edit_count = 26;

  int64 created_at = 30;
  int64 updated_at = 31;
}

// ========== Send ==========

message SendMessageReq {
  string conversation_id = 1 [(common.entity_id) = true];
  string from_user_id = 2 [(common.entity_id) = true];
  MessageType type = 3;

  oneof content {
    TextContent text = 10;
    ImageContent image = 11;
    FileContent file = 12;
    VideoContent video = 13;
    AudioContent audio = 14;
    LocationContent location = 15;
    CustomContent custom = 18;
    AttachmentContent attachment = 19;
  }

  optional string reply_to_id = 20 [(common.entity_id) = true];
  string client_msg_id = 25 [(common.submission_key) = true];
}

message SendMessageResp {
  string message_id = 1 [(common.entity_id) = true];
  int64 seq = 2 [(common.safe_sequence) = true];
  int64 created_at = 3;
  Message message = 4;
  FileContent file_metadata = 5;
}

// ========== Recall / Edit / Delete ==========

message RecallMessageReq {
  string message_id = 1 [(common.entity_id) = true];
  optional string conversation_id = 2 [(common.entity_id) = true]; // 未提供时由 message_id 定位；提供时校验一致性
  string user_id = 3 [(common.entity_id) = true];
}

message EditMessageReq {
  string message_id = 1 [(common.entity_id) = true];
  optional string conversation_id = 2 [(common.entity_id) = true]; // 未提供时由 message_id 定位；提供时校验一致性
  string user_id = 3 [(common.entity_id) = true];
  TextContent text = 10;
}

message DeleteMessageReq {
  string message_id = 1 [(common.entity_id) = true];
  optional string conversation_id = 2 [(common.entity_id) = true]; // 未提供时由 message_id 定位；提供时校验一致性
  string user_id = 3 [(common.entity_id) = true];
  bool delete_for_all = 4;
}

// ========== Get Messages ==========

// 消息历史游标是会话 seq；不能与会话列表等 opaque 字符串游标混用。
message MessagePagination {
  int32 limit = 1;
  int64 cursor = 2 [(common.safe_sequence) = true]; // 0 表示从最新消息开始
}

message MessagePaginationResp {
  int64 next_cursor = 1 [(common.safe_sequence) = true];
  bool has_more = 2;
  int64 total = 3;
}

message GetMessagesReq {
  string conversation_id = 1 [(common.entity_id) = true];
  string user_id = 2 [(common.entity_id) = true];
  MessagePagination pagination = 3;
  optional int64 before_time = 11;
  optional int64 after_time = 12;
  repeated MessageType filter_types = 13;
}

message GetMessagesResp {
  repeated Message messages = 1;
  MessagePaginationResp pagination = 2;
}

// ========== Get Around Seq ==========

message GetAroundSeqReq {
  string conversation_id = 1 [(common.entity_id) = true];
  string user_id = 2 [(common.entity_id) = true];
  int64 seq = 3 [(common.safe_sequence) = true];
  int32 limit = 4;
}

// ========== Sync ==========

message SyncMessagesReq {
  string user_id = 1 [(common.entity_id) = true];
  int64 position = 2 [(common.safe_sequence) = true];
  int32 limit = 3;
}

message InboxChange {
  int64 position = 1 [(common.safe_sequence) = true];
  string conversation_id = 2 [(common.entity_id) = true];
  string kind = 3;
  Message message = 4;
  optional string message_id = 5 [(common.entity_id) = true];
  Conversation conversation = 6;
  int64 last_read_seq = 7 [(common.safe_sequence) = true];
}

message ConversationSnapshot {
  Conversation conversation = 1;
  repeated Message messages = 2;
}

message SyncMessagesResp {
  repeated InboxChange changes = 1;
  bool has_more = 2;
  int64 next_position = 3 [(common.safe_sequence) = true];
  bool rebuild_required = 4;
  repeated ConversationSnapshot conversations = 5;
  string rebuild_reason = 6;
}

// ========== Get By ID ==========

message GetMessageByIDReq {
  string message_id = 1 [(common.entity_id) = true];
}

message GetMessageByIDResp {
  Message message = 1;
}

// ========== Batch Get ==========

message BatchGetMessagesReq {
  repeated string message_ids = 1 [(common.entity_id) = true];
}

message BatchGetMessagesResp {
  repeated Message messages = 1;
}

// ========== Search ==========

message SearchMessagesReq {
  string user_id = 1 [(common.entity_id) = true];
  string keyword = 2;
  optional string conversation_id = 3 [(common.entity_id) = true];
  optional int64 start_time = 4;
  optional int64 end_time = 5;
  optional string sender_id = 6 [(common.entity_id) = true];
  string sender_type = 7;
  repeated MessageType message_types = 8;
  common.Pagination pagination = 10;
}

message TypeCount {
  int32 msg_type = 1;
  int64 count = 2;
}

message SearchMessagesResp {
  repeated Message messages = 1;
  common.PaginationResp pagination = 2;
  map<string, string> highlights = 3;
  repeated TypeCount type_counts = 4;
}

// ========== Broadcast ==========

message SendBroadcastReq {
  string sender_id = 1 [(common.entity_id) = true];
  string content = 2;            // JSON: flexible content structure
  string scope = 3;              // "all", "group", or "user"
  optional string scope_target_id = 4 [(common.entity_id) = true];
}

message SendBroadcastResp {
  string broadcast_id = 1 [(common.entity_id) = true];
  int64 created_at = 2;
}

// ========== Bot Reply ==========

message SendBotReplyReq {
  string bot_id = 1 [(common.entity_id) = true];
  string conversation_id = 2 [(common.entity_id) = true];
  string text = 3;
  optional string reply_to_id = 4 [(common.entity_id) = true];
  string raw_payload = 5;        // JSON: model, tokens, etc.
}

message SendSystemMessageReq {
  string conversation_id = 1 [(common.entity_id) = true];
  optional string actor_id = 2 [(common.entity_id) = true];
  string actor_type = 3;
  string action = 4;
  string detail = 5;
  repeated string related_user_ids = 6 [(common.entity_id) = true];
  string payload = 7;
}

message SendBotReplyResp {
  string message_id = 1 [(common.entity_id) = true];
  int64 seq = 2 [(common.safe_sequence) = true];
  int64 created_at = 3;
}

// ========== Enums ==========

enum ConversationType {
  CONVERSATION_TYPE_UNSPECIFIED = 0;
  CONVERSATION_TYPE_PRIVATE = 1;
  CONVERSATION_TYPE_GROUP = 2;
  CONVERSATION_TYPE_SYSTEM = 3;
}

enum MemberRole {
  MEMBER_ROLE_UNSPECIFIED = 0;
  MEMBER_ROLE_OWNER = 1;
  MEMBER_ROLE_ADMIN = 2;
  MEMBER_ROLE_MEMBER = 3;
}

enum MemberType {
  MEMBER_TYPE_UNSPECIFIED = 0;
  MEMBER_TYPE_USER = 1;
  MEMBER_TYPE_BOT = 2;
}

// ========== Conversation Entity ==========

message Conversation {
  string id = 1 [(common.entity_id) = true];
  ConversationType type = 2;
  string name = 3;
  string avatar = 4;
  optional string owner_id = 5 [(common.entity_id) = true]; // 缺失表示无拥有者；不改变既有系统会话归属
  int32 member_count = 6;
  int64 max_seq = 7 [(common.safe_sequence) = true];
  optional string last_message_id = 8 [(common.entity_id) = true];
  string last_message_preview = 9;
  int64 last_read_seq = 10 [(common.safe_sequence) = true];
  int32 unread_count = 11;
  bool is_muted = 12;
  bool is_pinned = 13;
  bool is_muted_all = 14;
  string announcement = 15;
  string background = 16;
  int64 created_at = 20;
  int64 updated_at = 21;
}

// ========== Conversation Member ==========

message ConversationMember {
  // USER 仅提供 user_id，BOT 仅提供 bot_id；禁止用伪身份填充另一种成员引用。
  optional string user_id = 1 [(common.entity_id) = true];
  string username = 2;
  string avatar = 3;
  MemberRole role = 4;
  string alias = 5;
  int64 joined_at = 6;
  int64 last_read_seq = 7 [(common.safe_sequence) = true];
  bool is_muted = 8;
  int64 mute_until = 9;
  MemberType member_type = 10;
  optional string bot_id = 11 [(common.entity_id) = true];
  string bot_name = 12;
  string bot_avatar = 13;
}

// ========== Create ==========

message CreateConversationReq {
  ConversationType type = 1;
  string creator_id = 2 [(common.entity_id) = true];
  optional string peer_user_id = 10 [(common.entity_id) = true];
  optional string bot_id = 11 [(common.entity_id) = true];
  optional string name = 20;
  optional string avatar = 21;
  repeated string member_ids = 22 [(common.entity_id) = true];
}

message CreateConversationResp {
  string conversation_id = 1 [(common.entity_id) = true];
  Conversation conversation = 2;
}

// ========== Get ==========

message GetConversationReq {
  string conversation_id = 1 [(common.entity_id) = true];
  string user_id = 2 [(common.entity_id) = true];
}

message GetConversationResp {
  Conversation conversation = 1;
}

// ========== List ==========

message ListConversationsReq {
  string user_id = 1 [(common.entity_id) = true];
  common.CursorPagination pagination = 2;
  optional ConversationType type = 3;
  bool pinned_first = 4;
}

message ListConversationsResp {
  repeated Conversation conversations = 1;
  common.CursorPaginationResp pagination = 2;
}

// ========== Update ==========

message UpdateConversationReq {
  string conversation_id = 1 [(common.entity_id) = true];
  string user_id = 2 [(common.entity_id) = true];
  optional string name = 10;
  optional string avatar = 11;
  optional string background = 14;
}

// ========== Delete ==========

message DeleteConversationReq {
  string conversation_id = 1 [(common.entity_id) = true];
  string user_id = 2 [(common.entity_id) = true];
}

// ========== Add Members ==========

message AddMembersReq {
  string conversation_id = 1 [(common.entity_id) = true];
  string operator_id = 2 [(common.entity_id) = true];
  repeated string user_ids = 3 [(common.entity_id) = true];
}

message AddMembersResp {
  repeated string added_user_ids = 1 [(common.entity_id) = true];
  repeated string failed_user_ids = 2 [(common.entity_id) = true];
}

// ========== Remove Members ==========

message RemoveMembersReq {
  string conversation_id = 1 [(common.entity_id) = true];
  string operator_id = 2 [(common.entity_id) = true];
  repeated string user_ids = 3 [(common.entity_id) = true];
}

// ========== Get Members ==========

message GetMembersReq {
  string conversation_id = 1 [(common.entity_id) = true];
  optional string user_id = 2 [(common.entity_id) = true];
  common.Pagination pagination = 3;
  optional string bot_id = 4 [(common.entity_id) = true];
}

message GetMembersResp {
  repeated ConversationMember members = 1;
  common.PaginationResp pagination = 2;
}

// ========== Update Member ==========

message UpdateMemberReq {
  string conversation_id = 1 [(common.entity_id) = true];
  string operator_id = 2 [(common.entity_id) = true];
  string user_id = 3 [(common.entity_id) = true];
  optional MemberRole role = 4;
  optional string alias = 5;
}

// ========== IsMember ==========

// ========== GetMuteStatus ==========

// ========== PreCheckSend (merged permission check for message-service) ==========

// ========== GetMemberRole ==========

// ========== Mute All ==========

message MuteAllReq {
  string conversation_id = 1 [(common.entity_id) = true];
  string operator_id = 2 [(common.entity_id) = true];
}

message UnmuteAllReq {
  string conversation_id = 1 [(common.entity_id) = true];
  string operator_id = 2 [(common.entity_id) = true];
}

// ========== Mute/Unmute Member ==========

message MuteMemberReq {
  string conversation_id = 1 [(common.entity_id) = true];
  string operator_id = 2 [(common.entity_id) = true];
  string user_id = 3 [(common.entity_id) = true];
  int64 duration_seconds = 4;  // 0 = permanent until unmuted
}

message UnmuteMemberReq {
  string conversation_id = 1 [(common.entity_id) = true];
  string operator_id = 2 [(common.entity_id) = true];
  string user_id = 3 [(common.entity_id) = true];
}

// ========== Announcement ==========

message SetAnnouncementReq {
  string conversation_id = 1 [(common.entity_id) = true];
  string operator_id = 2 [(common.entity_id) = true];
  string content = 3;
}

message DeleteAnnouncementReq {
  string conversation_id = 1 [(common.entity_id) = true];
  string operator_id = 2 [(common.entity_id) = true];
}

// ========== Transfer Owner ==========

message TransferOwnerReq {
  string conversation_id = 1 [(common.entity_id) = true];
  string operator_id = 2 [(common.entity_id) = true];
  string new_owner_id = 3 [(common.entity_id) = true];
}

// ========== Settings ==========

message GetSettingsReq {
  string conversation_id = 1 [(common.entity_id) = true];
  string user_id = 2 [(common.entity_id) = true];
}

message GetSettingsResp {
  bool is_muted = 1;
  bool is_pinned = 2;
}

message UpdateSettingsReq {
  string conversation_id = 1 [(common.entity_id) = true];
  string user_id = 2 [(common.entity_id) = true];
  optional bool is_muted = 3;
  optional bool is_pinned = 4;
}

// ========== Mark As Read ==========

message MarkAsReadReq {
  string conversation_id = 1 [(common.entity_id) = true];
  string user_id = 2 [(common.entity_id) = true];
  int64 seq = 3 [(common.safe_sequence) = true];
}

// ========== Get Read Status ==========

message GetReadStatusReq {
  string message_id = 1 [(common.entity_id) = true];
  string conversation_id = 2 [(common.entity_id) = true];
}

message ReadUser {
  string user_id = 1 [(common.entity_id) = true];
  int64 read_at = 2;
  int64 last_read_seq = 3 [(common.safe_sequence) = true];
}

message GetReadStatusResp {
  int32 read_count = 1;
  int32 total_count = 2;
  repeated ReadUser read_users = 3;
}

// Ephemeral typing events are authorized and fanned out by the message domain.
message SendTypingEventReq {
  string conversation_id = 1 [(common.entity_id) = true];
  string user_id = 2 [(common.entity_id) = true];
  bool stopped = 3;
}

message SendTypingEventResp {}

// ========== Bot Messages ==========

message BotInConv {
  string bot_id = 1 [(common.entity_id) = true];
  string name = 2;
  string avatar = 3;
  string type = 4;
  reserved 5;
  string bot_settings = 6;
  string added_by = 7 [(common.entity_id) = true];
  int64 added_at = 8;
}

message AddBotReq {
  string conversation_id = 1 [(common.entity_id) = true];
  string bot_id = 2 [(common.entity_id) = true];
  string operator_id = 3 [(common.entity_id) = true];
  reserved 4;
  string bot_settings = 5;
}

message RemoveBotReq {
  string conversation_id = 1 [(common.entity_id) = true];
  string bot_id = 2 [(common.entity_id) = true];
  string operator_id = 3 [(common.entity_id) = true];
}

message UpdateBotReq {
  string conversation_id = 1 [(common.entity_id) = true];
  string bot_id = 2 [(common.entity_id) = true];
  string operator_id = 3 [(common.entity_id) = true];
  reserved 4;
  string bot_settings = 5;
}

message ListBotsReq {
  string conversation_id = 1 [(common.entity_id) = true];
  string user_id = 2 [(common.entity_id) = true];
}

message ListBotsResp {
  repeated BotInConv bots = 1;
}
