syntax = "proto3";

package bot;

import "common/common.proto";

option go_package = "github.com/maomeng/aim/app/bot-service/pb/bot";

service BotService {
  rpc StartRun(StartRunReq) returns (RunResponse);
  rpc GetRun(GetRunReq) returns (RunResponse);
  rpc ListRuns(ListRunsReq) returns (ListRunsResponse);
  rpc ExecutorUpdate(ExecutorUpdateReq) returns (RunResponse);
  rpc ControlRun(ControlRunReq) returns (RunResponse);
  rpc Authorization(AuthorizationReq) returns (AuthorizationResponse);

  // Bot CRUD
  rpc CreateBot(CreateBotReq) returns (Bot);
  rpc UpdateBot(UpdateBotReq) returns (Bot);
  rpc DeleteBot(DeleteBotReq) returns (common.BaseResponse);
  rpc GetBot(GetBotReq) returns (Bot);
  rpc ListBots(ListBotsReq) returns (ListBotsResp);

  // Secret management
  rpc RotateSecret(RotateSecretReq) returns (RotateSecretResp);

  // Webhook
  rpc HandleIncomingWebhook(WebhookReq) returns (RunResponse);

  // Bot Token
  rpc IssueBotToken(IssueBotTokenReq) returns (IssueBotTokenResp);
  rpc ValidateBotToken(ValidateBotTokenReq) returns (ValidateBotTokenResp);

  // Global MCP Server Management
  rpc CreateMcpServer(CreateMcpServerReq) returns (McpServerInfo);
  rpc UpdateMcpServer(UpdateMcpServerReq) returns (McpServerInfo);
  rpc DeleteMcpServer(DeleteMcpServerReq) returns (common.BaseResponse);
  rpc GetMcpServer(GetMcpServerReq) returns (McpServerInfo);
  rpc ListMcpServers(ListMcpServersReq) returns (ListMcpServersResp);

  // Bot MCP Assignment
  rpc AssignMcpToBot(AssignMcpToBotReq) returns (common.BaseResponse);
  rpc UnassignMcpFromBot(UnassignMcpFromBotReq) returns (common.BaseResponse);
  rpc ListBotMcpServers(ListBotMcpServersReq) returns (ListBotMcpServersResp);
  rpc UpdateBotMcpServer(UpdateBotMcpServerReq) returns (common.BaseResponse);

  // MCP Tool Discovery
  rpc DiscoverMcpTools(DiscoverMcpToolsReq) returns (DiscoverMcpToolsResp);
  rpc ListMcpTools(ListMcpToolsReq) returns (ListMcpToolsResp);

  // Read APIs for other services
  rpc BatchGetBots(BatchGetBotsReq) returns (BatchGetBotsResp);
  rpc GetBotWebhookConfig(GetBotWebhookConfigReq) returns (GetBotWebhookConfigResp);
}

// ========== Enums ==========

enum BotType {
  BOT_TYPE_UNSPECIFIED = 0;
  BOT_TYPE_OFFICIAL = 1;
  BOT_TYPE_SELF_DEPLOYED = 2;
  BOT_TYPE_THIRD_PARTY = 3;
}

enum BotStatus {
  BOT_STATUS_UNSPECIFIED = 0;
  BOT_STATUS_ACTIVE = 1;
  BOT_STATUS_DISABLED = 2;
}

enum ConnMode {
  CONN_MODE_UNSPECIFIED = 0;
  CONN_MODE_WS = 1;
  CONN_MODE_WEBHOOK = 2;
}

// ========== Bot Entity ==========

message Bot {
  string id = 1 [(common.entity_id) = true];
  optional string owner_id = 2 [(common.entity_id) = true];
  string name = 3;
  string avatar = 4;
  string type = 5;
  string status = 7;

  // AI config
  bool use_platform_model = 10;
  string model_name = 11;
  string base_url = 12;
  string system_prompt = 13;
  string persona = 14;
  bool enable_knowledge = 15;
  double temperature = 16;
  int32 max_context_messages = 17;
  bool streaming_enabled = 18;
  int32 max_context_tokens = 19;

  reserved 20 to 25;
  reserved "memory_model_name", "memory_use_platform_model", "memory_model_id", "memory_limit", "memory_embedding_model_name", "memory_embedding_model_id";

  // Connection config (third_party)
  string conn_mode = 30;
  string callback_url = 31;
  bool has_webhook_secret = 32;
  bool has_app_secret = 33;

  // General
  repeated string bot_tags = 40;
  string capabilities = 41;  // JSONB
  string settings = 42;      // JSONB

  optional string model_id = 52 [(common.entity_id) = true];
  string template_id = 53;  // "qa" | "knowledge" (official only)
  string sub_type = 54;     // "webhook" | "ws" (third_party only)

  // Trigger config
  repeated string response_triggers = 55;  // "always" | "mention" | "keyword:xxx"

  string owner_type = 56; // platform | user；所有权与 Bot type、template_id 独立

  int64 created_at = 50;
  int64 updated_at = 51;
}

// ========== Create Bot ==========

message CreateBotReq {
  optional string owner_id = 1 [(common.entity_id) = true];
  string name = 2;
  string type = 3;
  string avatar = 4;

  // AI config
  bool use_platform_model = 10;
  string model_name = 11;
  string base_url = 12;
  string api_key = 13;         // plaintext, server encrypts
  string system_prompt = 14;
  string persona = 15;
  bool enable_knowledge = 16;
  double temperature = 17;
  int32 max_context_messages = 18;
  bool streaming_enabled = 19;
  int32 max_context_tokens = 25;

  reserved 20 to 24, 26, 27;
  reserved "memory_model_name", "memory_use_platform_model", "memory_model_id", "memory_api_key", "memory_limit", "memory_embedding_model_name", "memory_embedding_model_id";

  // Connection config (third_party)
  string conn_mode = 30;
  string callback_url = 31;

  repeated string bot_tags = 40;
  string capabilities = 41;
  string settings = 42;
  optional string model_id = 43 [(common.entity_id) = true];
  string template_id = 44;
  string sub_type = 45;

  repeated string response_triggers = 46;  // "always" | "mention" | "keyword:xxx"
  string owner_type = 47; // platform 不提供 owner_id；user 必须提供有效 owner_id
}

// ========== Update Bot ==========

message UpdateBotReq {
  string bot_id = 1 [(common.entity_id) = true];
  string user_id = 2 [(common.entity_id) = true];           // caller, must be owner

  string name = 3;
  string avatar = 4;
  string status = 5;

  bool use_platform_model = 10;
  string model_name = 11;
  string base_url = 12;
  string api_key = 13;
  string system_prompt = 14;
  string persona = 15;
  bool enable_knowledge = 16;
  double temperature = 17;
  int32 max_context_messages = 18;
  bool streaming_enabled = 19;
  int32 max_context_tokens = 25;

  reserved 20 to 24, 26, 27, 48, 49;
  reserved "memory_model_name", "memory_use_platform_model", "memory_model_id", "memory_api_key", "memory_limit", "memory_embedding_model_name", "memory_embedding_model_id", "clear_memory_model_id", "clear_memory_embedding_model_id";

  string conn_mode = 30;
  string callback_url = 31;

  repeated string bot_tags = 40;
  string capabilities = 41;
  string settings = 42;
  optional string model_id = 43 [(common.entity_id) = true];
  string template_id = 44;
  string sub_type = 45;

  repeated string response_triggers = 46;  // "always" | "mention" | "keyword:xxx"
  // 未提供且 clear=false 保持，clear=true 解除；同时提供引用与 clear=true 拒绝。
  bool clear_model_id = 47;
}

// ========== Delete Bot ==========

message DeleteBotReq {
  string bot_id = 1 [(common.entity_id) = true];
  string user_id = 2 [(common.entity_id) = true];
}

// ========== Get Bot ==========

message GetBotReq {
  string bot_id = 1 [(common.entity_id) = true];
}

// ========== List Bots ==========

message ListBotsReq {
  optional string owner_id = 1 [(common.entity_id) = true];
  string status = 2;
  common.Pagination pagination = 3;
  string owner_type = 4; // platform | user；平台不提供 owner_id，用户所有提供 owner_id
}

message ListBotsResp {
  repeated Bot bots = 1;
  common.PaginationResp pagination = 2;
}

// ========== Rotate Secret ==========

message RotateSecretReq {
  string bot_id = 1 [(common.entity_id) = true];
  string user_id = 2 [(common.entity_id) = true];
}

message RotateSecretResp {
  string webhook_secret = 1;
  string app_secret = 2;
}

// ========== Webhook ==========

message WebhookReq {
  optional string bot_id = 1 [(common.entity_id) = true]; // 未提供时按既有 HMAC secret 验证并解析 Bot，不能以伪身份代替缺失
  bytes body = 2;
  string signature = 3;
  int64 timestamp = 4;
}


// ========== Bot Token ==========

message IssueBotTokenReq {
  string bot_id = 1 [(common.entity_id) = true];
  string user_id = 2 [(common.entity_id) = true];
  int64 ttl_seconds = 3;
}

message IssueBotTokenResp {
  string token = 1;
  int64 expires_at = 2;
}

message ValidateBotTokenReq {
  string token = 1;
}

message ValidateBotTokenResp {
  bool valid = 1;
  optional string bot_id = 2 [(common.entity_id) = true];
  optional string owner_id = 3 [(common.entity_id) = true];
  string type = 4;
  optional string owner_type = 5; // valid=true 时提供 platform | user；valid=false 时缺失
}

// ========== MCP Server Info ==========

message McpServerInfo {
  string id = 1 [(common.entity_id) = true];
  string name = 2;
  string description = 3;
  string transport = 4;      // sse / http-streamable / stdio
  string url = 5;
  string command = 6;
  repeated string args = 7;
  string env = 8;            // JSON
  int32 timeout_ms = 11;
  string status = 12;
  optional string created_by = 13 [(common.entity_id) = true];
  int64 created_at = 14;
  int64 updated_at = 15;
  // new fields
  string auth_config = 16;      // JSON: {api_key, token}
  string advanced_config = 17;  // JSON: {timeout, retry_count, retry_delay}
  bool enabled = 18;
  // created_by 仅表示创建审计，不兼任所有者；平台对象的 owner_id 缺失。
  string owner_type = 19; // platform | user
  optional string owner_id = 20 [(common.entity_id) = true];
}

// ========== Global MCP CRUD ==========

message CreateMcpServerReq {
  string user_id = 1 [(common.entity_id) = true];
  string name = 2;
  string description = 3;
  string transport = 4;      // sse / http-streamable / stdio
  string url = 5;
  string command = 6;
  repeated string args = 7;
  string env = 8;
  int32 timeout_ms = 11;
  // new fields
  string auth_config = 12;      // JSON
  string advanced_config = 13;  // JSON
  bool enabled = 14;
  string owner_type = 15; // platform | user；仍执行既有平台管理权限校验
  optional string owner_id = 16 [(common.entity_id) = true];
}

message UpdateMcpServerReq {
  string id = 1 [(common.entity_id) = true];
  string user_id = 2 [(common.entity_id) = true];
  string name = 3;
  string description = 4;
  string transport = 5;
  string url = 6;
  string command = 7;
  repeated string args = 8;
  string env = 9;
  int32 timeout_ms = 12;
  string status = 13;
  // new fields
  string auth_config = 14;      // JSON
  string advanced_config = 15;  // JSON
  bool enabled = 16;
}

message DeleteMcpServerReq {
  string id = 1 [(common.entity_id) = true];
  string user_id = 2 [(common.entity_id) = true];
}

message GetMcpServerReq {
  string id = 1 [(common.entity_id) = true];
  string user_id = 2 [(common.entity_id) = true];
}

message ListMcpServersReq {
  string user_id = 1 [(common.entity_id) = true];
  string status = 2;
  common.Pagination pagination = 3;
}

message ListMcpServersResp {
  repeated McpServerInfo servers = 1;
  common.PaginationResp pagination = 2;
}

// ========== Bot MCP Assignment ==========

message AssignMcpToBotReq {
  string bot_id = 1 [(common.entity_id) = true];
  string user_id = 2 [(common.entity_id) = true];
  string mcp_server_id = 3 [(common.entity_id) = true];
}

message UnassignMcpFromBotReq {
  string bot_id = 1 [(common.entity_id) = true];
  string user_id = 2 [(common.entity_id) = true];
  string mcp_server_id = 3 [(common.entity_id) = true];
}

message ListBotMcpServersReq {
  string bot_id = 1 [(common.entity_id) = true];
}

message BotMcpServerInfo {
  string id = 1 [(common.entity_id) = true];
  string mcp_server_id = 2 [(common.entity_id) = true];
  string name = 3;
  string description = 4;
  string transport = 5;
  string url = 6;
  string discovery = 7;
  repeated string tools = 8;
  int32 timeout_ms = 9;
  string status = 10;
  bool enabled = 11;
}

message ListBotMcpServersResp {
  repeated BotMcpServerInfo servers = 1;
}

message UpdateBotMcpServerReq {
  string bot_id = 1 [(common.entity_id) = true];
  string user_id = 2 [(common.entity_id) = true];
  string mcp_server_id = 3 [(common.entity_id) = true];
  bool enabled = 4;
}

// ========== MCP Tool Discovery ==========

message McpToolInfo {
  string id = 1 [(common.entity_id) = true];
  string mcp_server_id = 2 [(common.entity_id) = true];
  string name = 3;
  string description = 4;
  string input_schema = 5;  // JSON
  int64 updated_at = 6;
}

message DiscoverMcpToolsReq {
  string user_id = 1 [(common.entity_id) = true];
  string mcp_server_id = 2 [(common.entity_id) = true];
}

message DiscoverMcpToolsResp {
  repeated McpToolInfo tools = 1;
}

message ListMcpToolsReq {
  string user_id = 1 [(common.entity_id) = true];
  string mcp_server_id = 2 [(common.entity_id) = true];
}

message ListMcpToolsResp {
  repeated McpToolInfo tools = 1;
}

// ========== Read APIs for other services ==========

message BatchGetBotsReq {
  repeated string bot_ids = 1 [(common.entity_id) = true];
}

message BatchGetBotsResp {
  repeated Bot bots = 1;
}

message GetBotWebhookConfigReq {
  string bot_id = 1 [(common.entity_id) = true];
}

message GetBotWebhookConfigResp {
  string conn_mode = 1;
  string callback_url = 2;
  string webhook_secret = 3;
  string status = 4;
  string type = 5;
}

message StartRunReq {
  string bot_id = 1 [(common.entity_id) = true];
  string conv_id = 2 [(common.entity_id) = true];
  string submission_key = 3 [(common.submission_key) = true];
  string message = 4;
  optional string reply_to_msg_id = 5 [(common.entity_id) = true];
  optional string history_grant_id = 6 [(common.entity_id) = true];
  optional string parent_run_id = 7 [(common.entity_id) = true];
  repeated string message_ids = 8 [(common.entity_id) = true];
  repeated string file_ids = 9 [(common.entity_id) = true];
  string visibility = 10;
  repeated string resource_grant_ids = 11 [(common.entity_id) = true];
}

message GetRunReq { string run_id = 1 [(common.entity_id) = true]; }
message ListRunsReq {
  string conv_id = 1 [(common.entity_id) = true];
  int32 limit = 2;
}
message RunResponse { string run_json = 1; }
message ListRunsResponse { string runs_json = 1; }

message ExecutorUpdateReq {
  string bot_id = 1 [(common.entity_id) = true];
  string token = 2;
  bytes body = 3;
}
message ControlRunReq {
  string run_id = 1 [(common.entity_id) = true];
  string operation = 2;
  string message = 3;
  string submission_key = 4 [(common.submission_key) = true];
  optional string source_message_id = 5 [(common.entity_id) = true];
  repeated string message_ids = 6 [(common.entity_id) = true];
  repeated string file_ids = 7 [(common.entity_id) = true];
  optional string history_grant_id = 8 [(common.entity_id) = true];
  optional string target_user_id = 9 [(common.entity_id) = true];
}

message AuthorizationReq {
	// resource | action | delegation; delegation is executor-only and carries
	// operation delegate/result with run_id, generation and input_version.
  string kind = 1;
  bytes body = 2;
  string executor_bot_id = 3 [(common.entity_id) = true];
  string token = 4;
}
message AuthorizationResponse { bytes body = 1; }

