syntax = "proto3";
package realtime;
option go_package = "github.com/maomeng/aim/app/realtime-service/pb/realtime";
import "common/common.proto";

message Notification {
  string id = 1 [(common.entity_id) = true];
  string user_id = 2 [(common.entity_id) = true];
  int32 type = 3;
  string title = 4;
  string content = 5;
  bool is_read = 6;
  optional string reference_id = 7 [(common.entity_id) = true]; // 本地关联对象 UUID，缺失表示不关联对象
  int64 created_at = 8;
  optional string reference_type = 9; // 与 reference_id 一同提供；明确对象种类，不按字段名猜测
}
message ListNotificationsReq { common.Pagination pagination = 1; optional int32 type = 2; optional bool is_read = 3; }
message ListNotificationsResp { repeated Notification notifications = 1; common.PaginationResp pagination = 2; }
message GetUnreadCountReq {}
message GetUnreadCountResp { int64 count = 1; }
message MarkReadReq { string notification_id = 1 [(common.entity_id) = true]; }
message MarkReadResp {}
message MarkAllReadReq {}
message MarkAllReadResp {}
message DeleteNotificationReq { string notification_id = 1 [(common.entity_id) = true]; }
message DeleteNotificationResp {}
message PushNotificationReq { repeated string user_ids = 1 [(common.entity_id) = true]; int32 type = 2; string title = 3; string content = 4; optional string reference_id = 5 [(common.entity_id) = true]; optional string reference_type = 6; }
message PushNotificationResp { optional string first_notification_id = 1 [(common.entity_id) = true]; }
message IsOnlineReq { string user_id = 1 [(common.entity_id) = true]; }
message IsOnlineResp { bool online = 1; }
message BatchIsOnlineReq { repeated string user_ids = 1 [(common.entity_id) = true]; }
message BatchIsOnlineResp { map<string, bool> status = 1 [(common.entity_id) = true]; }
message RegisterDeviceReq { string device_id = 1; string platform = 2; string token = 3; }
message RegisterDeviceResp {}
message UnregisterDeviceReq { string device_id = 1; }
message UnregisterDeviceResp {}

service RealtimeService {
  rpc ListNotifications(ListNotificationsReq) returns (ListNotificationsResp);
  rpc GetUnreadCount(GetUnreadCountReq) returns (GetUnreadCountResp);
  rpc MarkRead(MarkReadReq) returns (MarkReadResp);
  rpc MarkAllRead(MarkAllReadReq) returns (MarkAllReadResp);
  rpc DeleteNotification(DeleteNotificationReq) returns (DeleteNotificationResp);
  rpc PushNotification(PushNotificationReq) returns (PushNotificationResp);
  rpc IsOnline(IsOnlineReq) returns (IsOnlineResp);
  rpc BatchIsOnline(BatchIsOnlineReq) returns (BatchIsOnlineResp);
  rpc RegisterDevice(RegisterDeviceReq) returns (RegisterDeviceResp);
  rpc UnregisterDevice(UnregisterDeviceReq) returns (UnregisterDeviceResp);
}
