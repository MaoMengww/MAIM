syntax = "proto3";

package user;

import "common/common.proto";

option go_package = "github.com/maomeng/aim/app/user-service/pb/user";

service UserService {
  // ========== Auth ==========
  rpc Register(RegisterReq) returns (RegisterResp);
  rpc Login(LoginReq) returns (LoginResp);
  rpc Logout(LogoutReq) returns (common.BaseResponse);
  rpc RefreshToken(RefreshTokenReq) returns (RefreshTokenResp);
  rpc OAuthLogin(OAuthLoginReq) returns (LoginResp);
  rpc ValidateToken(ValidateTokenReq) returns (ValidateTokenResp);
  rpc GetSessions(common.Empty) returns (GetSessionsResp);
  rpc RevokeSession(RevokeSessionReq) returns (common.BaseResponse);

  // ========== User Profile ==========
  rpc GetProfile(common.Empty) returns (UserInfo);
  rpc UpdateProfile(UpdateProfileReq) returns (UserInfo);
  rpc UpdatePassword(UpdatePasswordReq) returns (common.BaseResponse);
  rpc BindPhone(BindPhoneReq) returns (common.BaseResponse);
  rpc BindEmail(BindEmailReq) returns (common.BaseResponse);
  rpc GetUserInfo(GetUserInfoReq) returns (UserInfo);
  rpc BatchGetUserInfo(BatchGetUserInfoReq) returns (BatchGetUserInfoResp);
  rpc SearchUsers(SearchUsersReq) returns (SearchUsersResp);
  rpc ListAllUserIDs(common.Empty) returns (ListAllUserIDsResp);
  rpc BatchGetStatus(BatchGetStatusReq) returns (BatchGetStatusResp);
  rpc GetSettings(common.Empty) returns (GetSettingsResp);
  rpc UpdateSettings(UpdateSettingsReq) returns (common.BaseResponse);

  // ========== Balance ==========
  rpc Recharge(RechargeReq) returns (RechargeResp);
  rpc DeductBalance(DeductBalanceReq) returns (DeductBalanceResp);
  rpc GetBalance(GetBalanceReq) returns (GetBalanceResp);
  // ========== Friend Requests ==========
  rpc SendRequest(SendRequestReq) returns (SendRequestResp);
  rpc AcceptRequest(AcceptRequestReq) returns (common.BaseResponse);
  rpc RejectRequest(RejectRequestReq) returns (common.BaseResponse);
  rpc CancelRequest(CancelRequestReq) returns (common.BaseResponse);
  rpc ListPendingRequests(ListPendingRequestsReq) returns (ListRequestsResp);
  rpc ListSentRequests(ListSentRequestsReq) returns (ListRequestsResp);

  // ========== Friend Management ==========
  rpc ListFriends(ListFriendsReq) returns (ListFriendsResp);
  rpc DeleteFriend(DeleteFriendReq) returns (common.BaseResponse);
  rpc SetRemark(SetRemarkReq) returns (common.BaseResponse);
  rpc SetGroup(SetGroupReq) returns (common.BaseResponse);

  // ========== Friend Groups ==========
  rpc CreateGroup(CreateGroupReq) returns (CreateGroupResp);
  rpc RenameGroup(RenameGroupReq) returns (common.BaseResponse);
  rpc DeleteGroup(DeleteGroupReq) returns (common.BaseResponse);
  rpc ListGroups(ListGroupsReq) returns (ListGroupsResp);

  // ========== Blacklist ==========
  rpc BlockUser(BlockUserReq) returns (common.BaseResponse);
  rpc UnblockUser(UnblockUserReq) returns (common.BaseResponse);
  rpc ListBlacklist(ListBlacklistReq) returns (ListBlacklistResp);
  rpc IsBlocked(IsBlockedReq) returns (IsBlockedResp);
}

// ========== Auth Messages ==========

message RegisterReq {
  string username = 1;
  string password = 2;
  string phone = 3;
  string email = 4;
  string device_id = 5;
  string platform = 6; // ios/android/web
}

message RegisterResp {
  string user_id = 1 [(common.entity_id) = true];
  TokenPair tokens = 2;
  UserInfo user = 3;
}

message LoginReq {
  string account = 1;  // username/phone/email
  string password = 2;
  string device_id = 3;
  string platform = 4;
}

message LoginResp {
  string user_id = 1 [(common.entity_id) = true];
  TokenPair tokens = 2;
  UserInfo user = 3;
}

message LogoutReq {
  string token_id = 1;
}

message RefreshTokenReq {
  string refresh_token = 1;
}

message RefreshTokenResp {
  TokenPair tokens = 1;
  UserInfo user = 2;
}

message OAuthLoginReq {
  string provider = 1; // github/google/...
  string code = 2;
  string device_id = 3;
  string platform = 4;
}

message ValidateTokenReq {
  string access_token = 1;
}

message ValidateTokenResp {
  bool valid = 1;
  optional string user_id = 2 [(common.entity_id) = true]; // valid=false 时不提供
  string device_id = 3;
  int64 expires_at = 4;
}

message SessionInfo {
  string session_id = 1 [(common.entity_id) = true]; // 持久化账号设备记录 UUID，与 device_id 不同
  string device_id = 2;
  string platform = 3;
  string ip = 4;
  string location = 5;
  int64 last_active_at = 6;
  int64 created_at = 7;
  bool is_current = 8;
  bool is_online = 9;
}

message GetSessionsResp {
  repeated SessionInfo sessions = 1;
}

message RevokeSessionReq {
  string user_id = 1 [(common.entity_id) = true];
  string session_id = 2 [(common.entity_id) = true];
}

message TokenPair {
  string access_token = 1;
  string refresh_token = 2;
  int64 access_expire = 3;
  int64 refresh_expire = 4;
}

// ========== User Profile Messages ==========

message UserInfo {
  string id = 1 [(common.entity_id) = true];
  string username = 2;
  string phone = 3;
  string email = 4;
  string avatar = 5;
  int32 gender = 6;         // 0: unknown, 1: male, 2: female
  string bio = 7;
  int64 birthday = 8;       // unix timestamp
  int64 created_at = 9;
  int64 updated_at = 10;
  double balance = 11;
}

message UpdateProfileReq {
  string user_id = 1 [(common.entity_id) = true];
  optional string avatar = 2;
  optional int32 gender = 3;
  optional string bio = 4;
  optional int64 birthday = 5;

  // password change (handled separately via UpdatePassword)
  string old_password = 6;
  string new_password = 7;

  // phone binding
  string phone = 8;
  string phone_code = 9;

  // email binding
  string email = 10;
  string email_code = 11;
}

message UpdatePasswordReq {
  string old_password = 1;
  string new_password = 2;
}

message BindPhoneReq {
  string phone = 1;
  string phone_code = 2;
}

message BindEmailReq {
  string email = 1;
  string email_code = 2;
}

message GetUserInfoReq {
  string user_id = 1 [(common.entity_id) = true];
}

message BatchGetUserInfoReq {
  repeated string user_ids = 1 [(common.entity_id) = true];
}

message BatchGetUserInfoResp {
  repeated UserInfo users = 1;
}

message SearchUsersReq {
  string keyword = 1;
  common.Pagination pagination = 2;
}

message SearchUsersResp {
  repeated UserInfo users = 1;
  common.PaginationResp pagination = 2;
}

message ListAllUserIDsResp {
  repeated string user_ids = 1 [(common.entity_id) = true];
}

message BatchGetStatusReq {
  repeated string user_ids = 1 [(common.entity_id) = true];
}

message DeviceInfo {
  string device_id = 1;
  string platform = 2; // ios/android/web
  int64 last_active_at = 3;
}

message UserStatus {
  string user_id = 1 [(common.entity_id) = true];
  bool is_online = 2;
  repeated DeviceInfo devices = 3;
}

message BatchGetStatusResp {
  repeated UserStatus statuses = 1;
}

message GetSettingsResp {
  string language = 1;
  bool notification_enabled = 2;
  bool sound_enabled = 3;
  bool vibration_enabled = 4;
  string theme = 5;        // light/dark/auto
  string settings_json = 6; // extensible settings
  optional string ai_model_id = 7 [(common.entity_id) = true];
  string ai_model_name = 8;
}

message UpdateSettingsReq {
  string user_id = 1 [(common.entity_id) = true];
  optional string language = 2;
  optional bool notification_enabled = 3;
  optional bool sound_enabled = 4;
  optional bool vibration_enabled = 5;
  optional string theme = 6;
  optional string settings_json = 7;
  optional string ai_model_id = 8 [(common.entity_id) = true];
  optional string ai_model_name = 9;
  // 未提供 ai_model_id 且 clear=false：保持；clear=true：解除；同时提供两者：拒绝。
  bool clear_ai_model_id = 10;
}

// ========== Balance Messages ==========

message RechargeReq {
  string user_id = 1 [(common.entity_id) = true];
  double amount = 2;
}

message RechargeResp {
  double new_balance = 1;
}

message DeductBalanceReq {
  string user_id = 1 [(common.entity_id) = true];
  double amount = 2;
}

message DeductBalanceResp {
  double new_balance = 1;
}

message GetBalanceReq {
  string user_id = 1 [(common.entity_id) = true];
}

message GetBalanceResp {
  double balance = 1;
}

// ========== Friend Request Messages ==========

message SendRequestReq {
  string from_user_id = 1 [(common.entity_id) = true];
  string to_user_id = 2 [(common.entity_id) = true];
  string message = 3; // 验证消息
}

message SendRequestResp {
  string request_id = 1 [(common.entity_id) = true];
}

message AcceptRequestReq {
  string request_id = 1 [(common.entity_id) = true];
  string user_id = 2 [(common.entity_id) = true];
}

message RejectRequestReq {
  string request_id = 1 [(common.entity_id) = true];
  string user_id = 2 [(common.entity_id) = true];
}

message CancelRequestReq {
  string request_id = 1 [(common.entity_id) = true];
  string user_id = 2 [(common.entity_id) = true];
}

message ListPendingRequestsReq {
  string user_id = 1 [(common.entity_id) = true];
  common.Pagination pagination = 2;
}

message ListSentRequestsReq {
  string user_id = 1 [(common.entity_id) = true];
  common.Pagination pagination = 2;
}

message FriendRequest {
  string request_id = 1 [(common.entity_id) = true];
  string from_user_id = 2 [(common.entity_id) = true];
  string to_user_id = 3 [(common.entity_id) = true];
  string message = 4;
  string status = 5;       // pending/accepted/rejected
  int64 created_at = 6;
  int64 updated_at = 7;
  string from_username = 8;
  string from_avatar = 9;
}

message ListRequestsResp {
  repeated FriendRequest requests = 1;
  common.PaginationResp pagination = 2;
}

// ========== Friend Management Messages ==========

message ListFriendsReq {
  string user_id = 1 [(common.entity_id) = true];
  optional string group_id = 2 [(common.entity_id) = true]; // filter by group, omit for all
  common.Pagination pagination = 3;
}

message FriendInfo {
  string user_id = 1 [(common.entity_id) = true];
  string username = 2;
  string avatar = 3;
  string remark = 4;       // 备注名
  optional string group_id = 5 [(common.entity_id) = true];      // 所属分组
  string group_name = 6;   // 分组名
  string status = 7;       // online/offline
  int64 created_at = 8;    // 成为好友的时间
}

message ListFriendsResp {
  repeated FriendInfo friends = 1;
  common.PaginationResp pagination = 2;
}

message DeleteFriendReq {
  string user_id = 1 [(common.entity_id) = true];
  string friend_id = 2 [(common.entity_id) = true];
}

message SetRemarkReq {
  string user_id = 1 [(common.entity_id) = true];
  string friend_id = 2 [(common.entity_id) = true];
  string remark = 3;
}

message SetGroupReq {
  string user_id = 1 [(common.entity_id) = true];
  string friend_id = 2 [(common.entity_id) = true];
  optional string group_id = 3 [(common.entity_id) = true];
  // 未提供 group_id 且 clear=false：保持；clear=true：解除；同时提供两者：拒绝。
  bool clear_group_id = 4;
}

// ========== Friend Group Messages ==========

message CreateGroupReq {
  string user_id = 1 [(common.entity_id) = true];
  string name = 2;
}

message CreateGroupResp {
  string group_id = 1 [(common.entity_id) = true];
}

message RenameGroupReq {
  string group_id = 1 [(common.entity_id) = true];
  string user_id = 2 [(common.entity_id) = true];
  string name = 3;
}

message DeleteGroupReq {
  string group_id = 1 [(common.entity_id) = true];
  string user_id = 2 [(common.entity_id) = true];
}

message ListGroupsReq {
  string user_id = 1 [(common.entity_id) = true];
}

message FriendGroup {
  string id = 1 [(common.entity_id) = true];
  string name = 2;
  int32 sort_order = 3;
  int32 friend_count = 4;
  int64 created_at = 5;
}

message ListGroupsResp {
  repeated FriendGroup groups = 1;
}

// ========== Blacklist Messages ==========

message BlockUserReq {
  string user_id = 1 [(common.entity_id) = true];
  string blocked_user_id = 2 [(common.entity_id) = true];
}

message UnblockUserReq {
  string user_id = 1 [(common.entity_id) = true];
  string blocked_user_id = 2 [(common.entity_id) = true];
}

message ListBlacklistReq {
  string user_id = 1 [(common.entity_id) = true];
  common.Pagination pagination = 2;
}

message BlacklistUser {
  string user_id = 1 [(common.entity_id) = true];
  string username = 2;
  string avatar = 3;
  int64 blocked_at = 4;
}

message ListBlacklistResp {
  repeated BlacklistUser users = 1;
  common.PaginationResp pagination = 2;
}

message IsBlockedReq {
  string user_id = 1 [(common.entity_id) = true];
  string target_user_id = 2 [(common.entity_id) = true];
}

message IsBlockedResp {
  bool is_blocked = 1;
}

