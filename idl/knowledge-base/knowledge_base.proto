syntax = "proto3";

package knowledgebase;

option go_package = "github.com/maomeng/aim/app/knowledge-base/pb/knowledgebase";

import "common/common.proto";

import "google/protobuf/empty.proto";

service KnowledgeBase {
    // ========== KB CRUD ==========
    rpc CreateKB(CreateKBReq) returns (KBRsp);
    rpc UpdateKB(UpdateKBReq) returns (KBRsp);
    rpc DeleteKB(DeleteKBReq) returns (google.protobuf.Empty);
    rpc GetKB(GetKBReq) returns (KBRsp);
    rpc ListKBs(ListKBsReq) returns (ListKBsRsp);

    // ========== Document ==========
    rpc UploadDocument(stream UploadDocumentReq) returns (DocumentRsp);
    rpc GetDocument(GetDocumentReq) returns (DocumentRsp);
    rpc ListDocuments(ListDocumentsReq) returns (ListDocumentsRsp);
    rpc DeleteDocument(DeleteDocumentReq) returns (google.protobuf.Empty);
    rpc RetryDocument(RetryDocumentReq) returns (DocumentRsp);

    // ========== Retrieve ==========
    rpc Retrieve(RetrieveReq) returns (RetrieveRsp);

    // ========== Binding ==========
    rpc Bind(BindReq) returns (google.protobuf.Empty);
    rpc Unbind(UnbindReq) returns (google.protobuf.Empty);
    rpc ListBindings(ListBindingsReq) returns (ListBindingsRsp);
    rpc ListBoundTargets(ListBoundTargetsReq) returns (ListBoundTargetsRsp);

    // ========== Document Content & Chunks ==========
    rpc GetDocumentContent(GetDocumentContentReq) returns (GetDocumentContentResp);
    rpc ListChunks(ListChunksReq) returns (ListChunksResp);
    rpc ResourceAuthorization(ResourceAuthorizationReq) returns (ResourceAuthorizationResp);
}

message ResourceAuthorizationReq { bytes body = 1; }
message ResourceAuthorizationResp { bytes body = 1; }

// ============================================================
// KB
// ============================================================

message CreateKBReq {
    string name = 1;
    string description = 2;
    string embedding_model = 3;     // display only, resolved from embedding_model_id
    PipelineConfig pipeline_config = 4;
    string mode = 5;                // "rag"
    optional string embedding_model_id = 6 [(common.entity_id) = true];   // model registry ID
    string owner_type = 7; // platform | user；由既有鉴权决定允许的所有权
    optional string owner_id = 8 [(common.entity_id) = true];
}

message UpdateKBReq {
    string kb_id = 1 [(common.entity_id) = true];
    string name = 2;
    string description = 3;
    string embedding_model = 4;
    // 配置缺失表示保持；嵌套模型引用也遵守 presence + clear_model_id 的更新合同。
    PipelineConfig pipeline_config = 5;
    string status = 6;          // "active" | "disabled"
    optional string embedding_model_id = 7 [(common.entity_id) = true];
    // 未提供引用且 clear=false 保持，clear=true 解除；同时提供引用与 clear=true 拒绝。
    bool clear_embedding_model_id = 8;
}

message DeleteKBReq { string kb_id = 1 [(common.entity_id) = true]; }
message GetKBReq { string kb_id = 1 [(common.entity_id) = true]; }

message ListKBsReq {
    // 普通用户列出自有知识库；可信 Bot Run 仅发现当前获准的 active rag，且不返回配置或凭据。
    int32 offset = 1; // default: 0; must be non-negative
    int32 limit = 2;  // omitted/0: 20; explicit positive values must be <= 100
}

message KBRsp {
    string id = 1 [(common.entity_id) = true];
    optional string owner_id = 2 [(common.entity_id) = true];
    string name = 3;
    string description = 4;
    string embedding_model = 5;
    PipelineConfig pipeline_config = 6;
    int32 doc_count = 7;
    int32 total_chunks = 8;
    string status = 9;
    int64 created_at = 10;
    int64 updated_at = 11;
    string mode = 12;               // "rag"
    optional string embedding_model_id = 13 [(common.entity_id) = true];
    string owner_type = 14; // platform | user；平台不提供 owner_id
}

message ListKBsRsp {
    repeated KBRsp items = 1;
    int64 total = 2;
}

// ============================================================
// Pipeline Config
// ============================================================

message PipelineConfig {
    reserved 5;

    ParsingConfig parsing = 2;
    ChunkingConfig chunking = 3;
    RetrievalConfig retrieval = 4;
}

message ParsingConfig {
    // 解析引擎优先级列表，按顺序尝试第一个支持该文件类型的引擎
    // 可选值: "builtin", "mineru_precision", "mineru_agent"
    // builtin 支持: txt, md, html, json, xml, csv, yaml
    // mineru_precision 支持: pdf, doc/docx, ppt/pptx, xls/xlsx, 图片(≤200MB/200页)
    // mineru_agent 支持: pdf, doc/docx, 图片(≤10MB/20页)
    repeated string engines = 1;

    // MinerU 精准解析 API 配置（需申请 Token）
    MinerUConfig mineru_precision = 2;
    // MinerU Agent 轻量解析 API 配置（免登录，IP 限频）
    MinerUConfig mineru_agent = 3;

    // VLM 图片解析配置，将文档中的图片解析为文字
    VLMConfig vlm = 4;
}

message MinerUConfig {
    string api_url = 1;               // API 地址，为空则不启用该模式（自托管 MinerU）
    string api_token = 2;             // API Token（自托管 MinerU）
    string api_key = 3;               // mineru.net 云服务 API Key
}

message VLMConfig {
    bool enabled = 1;                 // 是否启用 VLM 图片解析
    string provider = 2;              // VLM 服务商，如 "openai"
    string model = 3;                 // VLM 模型名，如 "gpt-4o-mini"
    string api_key = 4;               // VLM API Key
    string base_url = 5;              // VLM 服务地址
    optional string model_id = 6 [(common.entity_id) = true];               // 模型注册表 ID，CreateKB 时用于查询 Provider/Model/APIKey/BaseURL
    // 更新时缺失且 clear=false 保持，clear=true 解除；同时提供引用与 clear=true 拒绝。
    // 创建配置时不提供 clear_model_id。
    bool clear_model_id = 7;
}

message ChunkingConfig {
    int32 chunk_size = 1;             // 100-4000, default: 512
    int32 overlap = 2;                // 0-500, default: 100
    repeated string separators = 3;   // 可选: "\n\n" "\n" "。" "！" "？" ";" "；"
    ParentChildConfig parent_child = 4;
}

message ParentChildConfig {
    bool enabled = 1;
    int32 parent_size = 2;            // 256-4096, default: 4096
    int32 child_size = 3;             // 64-1024, default: 384
}

message RetrievalConfig {
    string mode = 1;                  // "vector" | "hybrid" | "fulltext"; omitted: hybrid
    reserved 2;
    int32 candidate_top_k = 3;        // omitted: 20; effective budget is at least request limit
    float score_threshold = 4;        // omitted: 0 (no additional score threshold)
    float dense_weight = 5;           // dense weight for hybrid, default: 0.7
    float sparse_weight = 6;          // BM25 weight for hybrid, default: 0.3
    RerankConfig rerank = 7;
}

message RerankConfig {
    bool enabled = 1;
    optional string model_id = 2 [(common.entity_id) = true];
    int32 top_n = 3;                  // candidates to rerank, default: 20
    // 更新时缺失且 clear=false 保持，clear=true 解除；同时提供引用与 clear=true 拒绝。
    // 创建配置时不提供 clear_model_id。
    bool clear_model_id = 4;
}

// ============================================================
// Document
// ============================================================

message UploadDocumentReq {
    message MetaChunk {
        string title = 1;
        string file_type = 2;         // "pdf" | "md" | "txt" | "docx" | "html"
        int64 file_size = 3;
        string original_filename = 4;
        string content_hash = 5;      // SHA256
        string metadata = 6;          // JSON, user-defined tags
        PipelineConfig pipeline_override = 7;
    }
    oneof data {
        MetaChunk meta = 1;           // first frame: metadata
        bytes content = 2;            // subsequent frames: file content
    }
}

message GetDocumentReq { string doc_id = 1 [(common.entity_id) = true]; }

message ListDocumentsReq {
    string kb_id = 1 [(common.entity_id) = true];
    int32 offset = 2;
    int32 limit = 3;
    string status = 4;                // optional filter by status
}

message DeleteDocumentReq { string doc_id = 1 [(common.entity_id) = true]; }
message RetryDocumentReq { string doc_id = 1 [(common.entity_id) = true]; }

message DocumentRsp {
    string id = 1 [(common.entity_id) = true];
    string kb_id = 2 [(common.entity_id) = true];
    string title = 3;
    string file_type = 4;
    int64 file_size = 5;
    string original_filename = 6;
    string status = 7;                // "pending"|"parsing"|"chunking"|"embedding"|"ready"|"failed"
    int32 chunk_count = 8;
    string error_message = 9;
    string metadata = 10;             // JSON
    repeated StageInfo stages = 11;
    int64 created_at = 12;
    int64 updated_at = 13;
}

message StageInfo {
    string name = 1;                  // "parsing" | "chunking" | "embedding"
    string status = 2;
    int32 retries = 3;
    string error = 4;
    int64 started_at = 5;
    int64 ended_at = 6;
}

message ListDocumentsRsp {
    repeated DocumentRsp items = 1;
    int64 total = 2;
}

// ============================================================
// Retrieve
// ============================================================

// 可信 Run 无过滤时搜索本次授权的全部 active rag；普通身份提供 bot_id/conv_id
// 时自动解析绑定并逐项检查读取许可。绑定目标必须属于调用身份可访问的范围。
// 无绑定目标的普通身份可显式选择有读取许可的资源；无过滤返回空，不回退平台全库。
// kb_ids/doc_ids 仅缩小 Run/绑定默认范围，任何显式越权资源均拒绝。
message RetrieveReq {
    string query = 1;
    optional string bot_id = 2 [(common.entity_id) = true];
    optional string conv_id = 3 [(common.entity_id) = true];
    repeated string kb_ids = 4 [(common.entity_id) = true];
    repeated string doc_ids = 5 [(common.entity_id) = true];
    optional int32 limit = 6; // omitted: 5; explicit values: 1..50
}

message RetrieveRsp {
    repeated RetrieveItem items = 1;
    int32 limit = 2; // 本次结果数量上界，不保证返回满额
    bool exhaustive = 3; // 始终 false：搜索不承诺穷尽相关知识
}

message RetrieveItem {
    string chunk_id = 1 [(common.entity_id) = true];
    string content = 2;               // parent block full text for parent-child mode
    float score = 3;
    string doc_id = 4 [(common.entity_id) = true];
    string doc_title = 5;
    string kb_id = 6 [(common.entity_id) = true];
    string kb_name = 7;
    string matched_content = 8;       // matched child block text (parent-child mode)
    reserved 9; // replaced by lossless metadata_json; missing locations remain absent
    int32 chunk_index = 10;           // relational index of the directly matched chunk
    string metadata_json = 11;        // actual matched chunk metadata, no inferred locations
    optional string context_chunk_id = 12 [(common.entity_id) = true]; // supplemental parent only
    optional int32 context_chunk_index = 13;
    string context_metadata_json = 14; // actual supplemental parent metadata
}


// ============================================================
// Binding
// ============================================================

message BindReq {
    string kb_id = 1 [(common.entity_id) = true];
    string target_type = 2;           // "bot" | "conv"
    string target_id = 3 [(common.entity_id) = true];
}

message UnbindReq {
    string kb_id = 1 [(common.entity_id) = true];
    string target_type = 2;
    string target_id = 3 [(common.entity_id) = true];
}

message ListBindingsReq {
    string target_type = 1;           // "bot" | "conv"
    string target_id = 2 [(common.entity_id) = true];
}

message ListBindingsRsp {
    repeated BindingItem items = 1;
}

message BindingItem {
    string id = 1 [(common.entity_id) = true];
    string kb_id = 2 [(common.entity_id) = true];
    string kb_name = 3;
    string target_type = 4;
    string target_id = 5 [(common.entity_id) = true];
    int64 created_at = 6;
    string mode = 7;
}

message ListBoundTargetsReq { string kb_id = 1 [(common.entity_id) = true]; }

message ListBoundTargetsRsp {
    repeated BoundTargetItem items = 1;
}

message BoundTargetItem {
    string target_type = 1;
    string target_id = 2 [(common.entity_id) = true];
    int64 created_at = 3;
}

// ============================================================
// Document Content & Chunks
// ============================================================

message GetDocumentContentReq { string doc_id = 1 [(common.entity_id) = true]; }

message GetDocumentContentResp {
    string content = 1;
    string download_url = 2;
    string mime_type = 3;
    int64 file_size = 4;
}

message ListChunksReq {
    string doc_id = 1 [(common.entity_id) = true];
    int32 offset = 2;
    int32 limit = 3;
}

message ChunkInfo {
    string id = 1 [(common.entity_id) = true];
    string doc_id = 2 [(common.entity_id) = true];
    int32 chunk_index = 3;
    string content = 4;
    int32 token_count = 5;
    string metadata = 6;
    int64 created_at = 7;
}

message ListChunksResp {
    repeated ChunkInfo chunks = 1;
    int64 total = 2;
}
