x-aim-env: &aim-env
  POSTGRES_DSN_BASE: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  REDIS_ADDR: redis:6379
  KAFKA_BROKERS: '[kafka:9092]'
  ELASTICSEARCH_ADDRESSES: '[http://elasticsearch:9200]'
  MINIO_ENDPOINT: minio:9000
  MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-localhost:9000}
  MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
  MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
  MILVUS_HOST: milvus
  MILVUS_PORT: '19530'
  NEO4J_URI: bolt://neo4j:7687
  NEO4J_USER: neo4j
  NEO4J_PASSWORD: ${NEO4J_PASSWORD}
  OTEL_ENDPOINT: otel-collector:4317
  MINERU_URL: ${MINERU_URL:-http://host.docker.internal:30000}
  JWT_SECRET: ${JWT_SECRET:-aim-dev-secret-key}
  ENC_KEY: ${AIM_ENC_KEY}
  BOT_ENCRYPTION_KEY: ${BOT_ENCRYPTION_KEY:-}
  BOT_METRICS_PORT: ${BOT_METRICS_PORT:-9109}
  INGEST_REQUESTS_PER_SECOND: ${INGEST_REQUESTS_PER_SECOND:-5}
  INGEST_CONCURRENCY: ${INGEST_CONCURRENCY:-2}
  LLM_EMBED_ONLINE_RPM: ${LLM_EMBED_ONLINE_RPM:-80}
  LLM_EMBED_ONLINE_CONCURRENCY: ${LLM_EMBED_ONLINE_CONCURRENCY:-8}
  LLM_EMBED_INGEST_RPM: ${LLM_EMBED_INGEST_RPM:-20}
  LLM_EMBED_INGEST_CONCURRENCY: ${LLM_EMBED_INGEST_CONCURRENCY:-2}
  USER_SERVICE_ADDR: dns:///user-service:50051
  MESSAGE_SERVICE_ADDR: dns:///message-service:50053
  FILE_SERVICE_ADDR: dns:///file-service:50054
  BOT_SERVICE_ADDR: dns:///bot-service:50058
  BOT_RUNTIME_ADDR: dns:///bot-runtime:50058
  KNOWLEDGE_BASE_ADDR: dns:///knowledge-base:50057
  LLM_GATEWAY_ADDR: dns:///llm-gateway:50056
  REALTIME_SERVICE_ADDR: dns:///realtime-service:50061
  REALTIME_HEARTBEAT_INTERVAL: ${REALTIME_HEARTBEAT_INTERVAL:-30}
  REALTIME_REGISTRY_TTL_SECONDS: ${REALTIME_REGISTRY_TTL_SECONDS:-90}
  REALTIME_INSTANCE_ID: ${REALTIME_INSTANCE_ID:-}
  REALTIME_READINESS_DELAY_SECONDS: ${REALTIME_READINESS_DELAY_SECONDS:-5}
  REALTIME_DRAIN_SECONDS: ${REALTIME_DRAIN_SECONDS:-30}
  REALTIME_WRITE_TIMEOUT_SECONDS: ${REALTIME_WRITE_TIMEOUT_SECONDS:-5}
  REALTIME_SHUTDOWN_TIMEOUT_SECONDS: ${REALTIME_SHUTDOWN_TIMEOUT_SECONDS:-40}

services:
  postgres:
    image: postgres:16-alpine
    container_name: aim-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/postgres:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aim -d aim"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: postgres -c max_connections=500
    restart: unless-stopped



  redis:
    image: redis:7-alpine
    container_name: aim-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped



  minio:
    build:
      context: ./deploy/docker/minio
      dockerfile: Dockerfile
    image: aim-minio:RELEASE.2025-04-22T22-12-26Z
    container_name: aim-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped



  kafka:
    image: apache/kafka:3.7.0
    container_name: aim-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_HEAP_OPTS: "-Xmx1g -Xms512m"
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10


  init-kafka-topics:
    image: apache/kafka:3.7.0
    entrypoint: ["/bin/sh", "/init-kafka-topics.sh"]
    volumes:
      - ./deploy/docker/init-kafka-topics.sh:/init-kafka-topics.sh:ro
    depends_on:
      kafka:
        condition: service_healthy



  milvus:
    image: milvusdb/milvus:v2.6.11
    container_name: aim-milvus
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      DEPLOY_MODE: STANDALONE
      ETCD_USE_EMBED: "true"
      ETCD_DATA_DIR: /var/lib/milvus/etcd
      ETCD_CONFIG_PATH: /milvus/configs/embedEtcd.yaml
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - milvus_data:/var/lib/milvus
      - ./deploy/docker/embedEtcd.yaml:/milvus/configs/embedEtcd.yaml:ro
    depends_on:
      minio:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 90s


  elasticsearch:
    build:
      context: ./deploy/docker/elasticsearch
      dockerfile: Dockerfile
    image: aim-elasticsearch-ik:8.17.0
    container_name: aim-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms256m -Xmx256m
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q 'green\\|yellow'"]
      interval: 10s
      timeout: 10s
      retries: 15

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: aim-otel
    command: ["--config=/etc/otel-collector-config.yml"]
    volumes:
      - ./deploy/monitoring/otel-collector-config.yml:/etc/otel-collector-config.yml
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      jaeger:
        condition: service_started

    restart: unless-stopped


  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: aim-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4317"
      - "4318"
    restart: unless-stopped



  prometheus:
    image: prom/prometheus:latest
    container_name: aim-prometheus
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    restart: unless-stopped




  kibana:
    image: kibana:8.17.0
    container_name: aim-kibana
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      NODE_OPTIONS: "--max-old-space-size=512"
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy

    restart: unless-stopped


  grafana:
    image: grafana/grafana:latest
    container_name: aim-grafana
    ports:
      - "3030:3000"
    volumes:
      - ./deploy/monitoring/grafana/provisioning:/etc/grafana/provisioning
    restart: unless-stopped



  neo4j:
    image: neo4j:5-community
    container_name: aim-neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_dbms_memory_pagecache_size: 512m
      NEO4J_dbms_memory_heap_initial__size: 512m
      NEO4J_dbms_memory_heap_max__size: 1g
    ports:
      - "7687:7687"
      - "7474:7474"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ${NEO4J_PASSWORD} 'RETURN 1'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped



  # ────────────────────────────────────────────────────────
  # Application services
  # ────────────────────────────────────────────────────────

  user-service:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
      args:
        SERVICE: user-service
    image: aim-user-service:latest
    container_name: aim-user-service
    environment: *aim-env
    ports:
      - "50051:50051"
    depends_on:
      postgres:
        condition: service_healthy

    restart: unless-stopped


  message-service:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
      args:
        SERVICE: message-service
    image: aim-message-service:latest
    container_name: aim-message-service
    environment: *aim-env
    ports:
      - "50053:50053"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      init-kafka-topics:
        condition: service_completed_successfully

    restart: unless-stopped


  file-service:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
      args:
        SERVICE: file-service
    image: aim-file-service:latest
    container_name: aim-file-service
    environment: *aim-env
    ports:
      - "50054:50054"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

    restart: unless-stopped


  llm-gateway:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
      args:
        SERVICE: llm-gateway
    image: aim-llm-gateway:latest
    container_name: aim-llm-gateway
    environment:
      <<: *aim-env
      INGEST_EMBEDDING_TOKEN: ${INGEST_EMBEDDING_TOKEN:?Set a private token shared by ingestion and llm-gateway}
    ports:
      - "50056:50056"
    depends_on:
      postgres:
        condition: service_healthy

    restart: unless-stopped


  knowledge-base:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
      args:
        SERVICE: knowledge-base
    image: aim-knowledge-base:latest
    container_name: aim-knowledge-base
    command: ["-f", "/app/etc/knowledge-base.yaml", "-role", "online"]
    environment: *aim-env
    ports:
      - "50057:50057"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      milvus:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      kafka:
        condition: service_healthy
      init-kafka-topics:
        condition: service_completed_successfully

    restart: unless-stopped

  knowledge-ingest:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
      args:
        SERVICE: knowledge-base
    image: aim-knowledge-base:latest
    command: ["-f", "/app/etc/knowledge-base.yaml", "-role", "ingest"]
    environment:
      <<: *aim-env
      INGEST_EMBEDDING_TOKEN: ${INGEST_EMBEDDING_TOKEN:?Set a private token shared by ingestion and llm-gateway}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      milvus:
        condition: service_healthy
      kafka:
        condition: service_healthy
      init-kafka-topics:
        condition: service_completed_successfully
    restart: unless-stopped


  bot-service:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
      args:
        SERVICE: bot-service
    image: aim-bot-service:latest
    container_name: aim-bot-service
    command: ["-f", "/app/etc/bot.yaml", "-role", "control"]
    environment: *aim-env
    ports:
      - "50058:50058"
    depends_on:
      postgres:
        condition: service_healthy

    restart: unless-stopped



  bot-runtime:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
      args:
        SERVICE: bot-service
    image: aim-bot-service:latest
    command: ["-f", "/app/etc/bot.yaml", "-role", "runtime"]
    environment:
      <<: *aim-env
      # Keep runtime metrics off the control plane's default port; both roles
      # share one image and may share a host.
      BOT_METRICS_PORT: "9119"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      init-kafka-topics:
        condition: service_completed_successfully

    restart: unless-stopped


  realtime-service:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
      args:
        SERVICE: realtime-service
    image: aim-realtime-service:latest
    container_name: aim-realtime-service
    command: ["-f", "/app/etc/realtime.yaml"]
    environment: *aim-env
    ports:
      - "50061:50061"
      - "8081:8081"
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/readiness"]
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      init-kafka-topics:
        condition: service_completed_successfully

    restart: unless-stopped


  gateway:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
      args:
        SERVICE: gateway
    image: aim-gateway:latest
    container_name: aim-gateway
    environment: *aim-env
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy

    restart: unless-stopped


volumes:
  postgres_data:
  redis_data:
  minio_data:
  es_data:
  kafka_data:
  milvus_data:
  mineru_models:
  neo4j_data:
